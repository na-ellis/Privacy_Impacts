.",theme:"Critical infrastructure; cyber-physical consequence; availability; incident response",class_reading_connection:null,real_world_example:"2021 Colonial Pipeline ransomware incident",what_actually_happened:"Colonial Pipeline proactively shut down pipeline operations after a ransomware attack, creating broader fuel-supply impacts while the company worked to restore operations safely.",real_world_source:"https://www.energy.gov/ceser/colonial-pipeline-cyber-incident",real_world_image:null,decisions:[{branch_id:"B037",decision:"Shut down operations",consequence:"This choice lines up with the documented response in this case. Colonial Pipeline proactively shut down pipeline operations after a ransomware attack, creating broader fuel-supply impacts while the company worked to restore operations safely. The consequence is therefore grounded in what actually occurred rather than a simulated result.",consequence_type:"DIRECT_REAL_WORLD",consequence_basis_example:"2021 Colonial Pipeline ransomware incident",consequence_source:"https://www.energy.gov/ceser/colonial-pipeline-cyber-incident",risk_tag:"Public/Economic Impact"},{branch_id:"B038",decision:"isolate only known systems",consequence:"A comparable real-world case shows the kind of consequence this choice can create, though the case is an analogy rather than the same type of incident. In 2021, an intruder remotely accessed the Oldsmar, Florida water-treatment system and attempted to alter sodium hydroxide levels; an operator noticed and reversed the change before harm occurred. That case involved direct intrusion into an industrial control system, not a ransomware attack on a business network, but it illustrates how isolating only the systems already known to be affected can still leave other connected systems exposed to unnoticed tampering. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",conseque lth-data-advertising",risk_tag:"Growth Risk"},{branch_id:"B098",decision:"obtain explicit consent",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In 2017 VIZIO smart-TV viewing-data settlement, The FTC alleged VIZIO collected second-by-second viewing information from millions of smart TVs without adequate knowledge or consent and shared data for advertising-related purposes. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"2017 VIZIO smart-TV viewing-data settlement",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2017/02/vizio-pay-22-million-ftc-state-new-jersey-settle-charges-it-collected-viewing-histories-11-million",risk_tag:"Privacy Risk"},{branch_id:"B099",decision:"share limited/pseudonymous data",consequence:"This choice lines up with the documented response in this case. The FTC alleged BetterHelp shared sensitive health-related data with advertising platforms after promising consumers limited uses of that information. The consequence is therefore grounded in what actually occurred rather than a simulated result.",consequence_type:"DIRECT_REAL_WORLD",consequence_basis_example:"2023 BetterHelp health-data advertising case",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2023/07/ftc-gives-final-approval-order-banning-betterhelp-sharing-sensitive-health-data-advertising",risk_tag:"Privacy Risk"},{branch_id:"B100",decision:"use the data under existing privacy terms",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Cambridge Analytica / Facebook data harvesting, The FTC alleged Facebook data from tens of millions of users was deceptively harvested and used by Cambridge Analytica for voter profiling and targeting. This does not mean the same result is guaranteed here, but it p  person..",consequence_type:"TRADEOFF",consequence_basis_example:"2023 BetterHelp health-data advertising case",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2023/07/ftc-gives-final-approval-order-banning-betterhelp-sharing-sensitive-health-data-advertising",risk_tag:"Business Growth Risk"},{branch_id:"B102",decision:"use the service only if advertising use is opt-in",consequence:"This choice gives you some combination of access, convenience, safety, privacy, or control, while leaving you to accept the corresponding personal tradeoff. The central tradeoff is: Growth/advertising efficiency vs. sensitive health privacy and trust. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person..",consequence_type:"TRADEOFF",consequence_basis_example:"2023 BetterHelp health-data advertising case",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2023/07/ftc-gives-final-approval-order-banning-betterhelp-sharing-sensitive-health-data-advertising",risk_tag:"Consent Risk"},{branch_id:"B103",decision:"limit what sensitive information you provide where possible",consequence:"This choice gives you some combination of access, convenience, safety, privacy, or control, while leaving you to accept the corresponding personal tradeoff. The central tradeoff is: Growth/advertising efficiency vs. sensitive health privacy and trust. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person..",consequence_type:"TRADEOFF",consequence_basis_example:"2023 BetterHelp health-data advertising case",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2023/07/ftc-gives-final-approval-order-banning-betterhelp-sharing-sensitive-health-data-advertising",risk_tag:"Health Privacy Risk"},{branch_id:"B104",decision:"choose a provider that does not use treatment-related data for advertising",consequence:"This choice gives you some combination of access, convenience, safety, privacy, or control, while leaving you to accept the corresponding personal tradeoff. The central tradeoff is: Growth/advertising efficiency vs. sensitive health privacy and trust. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person..",consequence_type:"TRADEOFF",consequence_basis_example:"2023 BetterHelp health-data advertising case",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2023/07/ftc-gives-final-approval-order-banning-betterhelp-sharing-sensitive-health-data-advertising",risk_tag:"Public Trust Risk"}],id:"S101"},{role:"Privacy Officer",role_category:"Security & Privacy Leader",situation:"You are the Privacy Officer. You are responsible for identifying the privacy and security risk, recommending controls, and explaining the residual risk to leadership. Your online health service can improve customer acquisition by sharing identifiers and user attributes with advertising platforms, but the data can reveal highly sensitive information about why people seek care.",core_tradeoff:"Growth/advertising efficiency vs. sensitive health privacy and trust. From this role, weigh privacy/security risk, control effectiveness, residual risk, and duty of care.",theme:"Health privacy; secondary use; consent; data monetization",class_reading_connection:null,real_world_example:"2023 BetterHelp health-data advertising case",what_actually_happened:"The FTC alleged BetterHelp shared sensitive health-related data with advertising platforms after promising consumers limited uses of that information.",real_world_source:"https://www.ftc.gov/news-events/news/press-releases/2023/07/ftc-gives-final-approval-order-banning-betterhelp-sharing-sensitive-health-data-advertising",real_world_image:null,decisions:[{branch_id:"B105",decision:"Prohibit advertising use",consequence:"You gain the control or operational benefit of this option, but you must document and communicate the privacy/securi TC alleged Facebook data from tens of millions of users was deceptively harvested and used by Cambridge Analytica for voter profiling and targeting.",real_world_source:"https://www.ftc.gov/news-events/news/press-releases/2019/07/ftc-sues-cambridge-analytica-settles-former-ceo-app-developer",real_world_image:null,decisions:[{branch_id:"B125",decision:"Restrict third-party access",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In 2023 BetterHelp health-data advertising case, The FTC alleged BetterHelp shared sensitive health-related data with advertising platforms after promising consumers limited uses of that information. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"2023 BetterHelp health-data advertising case",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2023/07/ftc-gives-final-approval-order-banning-betterhelp-sharing-sensitive-health-data-advertising",risk_tag:"Platform Innovation Risk"},{branch_id:"B126",decision:"require consent from every affected person",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In 2017 VIZIO smart-TV viewing-data settlement, The FTC alleged VIZIO collected second-by-second viewing information from millions of smart TVs without adequate knowledge or consent and shared data for advertising-related purposes. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"2017 VIZIO smart-TV viewing-data settlement",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2017/02/vizio-pay-22-million-ftc-state-new-jersey-settle-charges-it-collected-viewing-histories-11-million",risk_tag:"Consent Risk"},{branch_id:"B127",decision:"permit broad access under developer rules",consequence:"Permitting broad third-party access under developer rules preserves the platform's openness and the pace of innovation that comes from outside developers building on the data. The tradeoff is that information about people, including those who never directly consented, can end up with parties the platform does not fully control.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Data Control Risk"},{branch_id:"B128",decision:"prioritize platform growth",consequence:"Prioritizing platform growth preserves the platform's ability to expand its user base and attract the developers and services that depend on rich data access. The tradeoff is that growth is pursued ahead of tightening consent and oversight, leaving less control over how outside parties use people's data.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Profiling Risk"}],id:"S125"},{role:"App Developer",role_category:"Product & Technology Leader",situation:"You are the App Developer. You are responsible for how the technology is designed, implemented, supported, and changed. Your platform allows third-party applications broad access to user and social-network data. That access encourages innovation and research but allows information about people who never directly consented to the third party's use.",core_tradeoff:"Platform openness/innovation vs. consent, profiling, and downstream data control. From this role, weigh technical feasibility, design choices, usability, scale, and unintended consequences.",theme:"Privacy; consent; social graphs; political profiling; secondary use",class_reading_connection:null,real_world_example:"Cambridge Analytica / Facebook data harvesting",what_actually_happened:"The FTC alleged Facebook data from tens of millions of users was deceptively harvested and used by Cambridge Analytica for voter profiling and targeting.",real_world_source:"https://www.ftc.gov/news-events/news/press-releases/2019/07/ftc-sues-cambridge-analytica-settles-former-ceo-app-developer",real_world_image:null,decisions:[{branch_id:"B129",decision:"Restrict third-party access",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In 2023 BetterHelp health-data advertising case, The FTC alleged BetterHelp shared sensitive health-related data with advertising platforms after promising consumers limited uses of that information. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"2023 BetterHelp health-data advertising case",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2023/07/ftc-gives-final-approval-order-banning-betterhelp-sharing-sensitive-health-data-advertising",risk_tag:"Platform Innovation Risk"},{branch_id:"B130",decision:"require consent from every affected person",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In 2017 VIZIO smart-TV viewing-data settlement, The FTC alleged VIZIO collected second-by-second viewing information from millions of smart TVs without adequate knowledge or consent and shared data for advertising-related purposes. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"2017 VIZIO smart-TV viewing-data settlement",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2017/02/vizio-pay-22-million-ftc-state-new-jersey-settle-charges-it-collected-viewing-histories-11-million",risk_tag:"Consent Risk"},{branch_id:"B131",decision:"permit broad access under developer rules",consequence:"Permitting broad third-party access under developer rules preserves the platform's openness and the pace of innovation that comes from outside developers building on the data. The tradeoff is that information about people, including those who never directly consented, can end up with parties the platform does not fully control.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Data Control Risk"},{branch_id:"B132",decision:"prioritize platform growth",consequence:"Prioritizing platform growth preserves the platform's ability to expand its user base and attract the developers and services that depend on rich data access. The tradeoff is that growth is pursued ahead of tightening consent and oversight, leaving less control over how outside parties use people's data.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Profiling Risk"}],id:"S129"},{role:"AI Product Owner",role_category:"Product & Technology Leader",situation:"You are the AI Product Owner. You are responsible for how the technology is designed, implemented, supported, and changed. Retail theft is increasing. Facial recognition could alert employees when a suspected repeat offender enters a store, but false matches may cause innocent customers to be followed, removed, or reported to police.",core_tradeoff:"Loss prevention and employee safety vs. accuracy, discrimination, privacy, and due process. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person.",theme:"AI governance; algorithmic bias; surveillance; human oversight",class_reading_connection:null,real_world_example:"2023 Rite Aid facial-recognition enforcement",what_actually_happened:"The FTC alleged Rite Aid deployed facial recognition without adequate safeguards, producing false positives and harms to consumers, with disproportionate impacts in some communities.",real_world_source:"https://www.ftc.gov/news-events/news/press-releases/2023/12/rite-aid-banned-using-ai-facial-recognition-after-ftc-says-retailer-deployed-technology-without",real_world_image:null,decisions:[{branch_id:"B133",decision:"Deploy broadly under the current design",consequence:"This choice changes how the technology is designed, operated, or supported. The benefit has to be weighed against usability, technical feasibility, scale, and unintended consequences. The central tradeoff is: Loss prevention and employee safety vs. accuracy, discrimination, privacy, and due process. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person..",consequence_type:"TRADEOFF",consequence_basis_example:"2023 Rite Aid facial-recognition enforcement",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2023/12/rite-aid-banned-using-ai-facial-recognition-after-ftc-says-retailer-deployed-technology-without",risk_tag:"Civil Liberties Risk"},{branch_id:"B134",decision:"pilot with human verification and measured error rates",consequence:"This choice changes how the technology is designed, operated, or supported. The benefit has to be weighed against usability, technical feasibility, scale, and unintended consequences. The central tradeoff is: Loss prevention and employee safety vs. accuracy, discrimination, privacy, and due process. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person..",consequence_type:"TRADEOFF",consequence_basis_example:"2023 Rite Aid facial-recognition enforcement",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2023/12/rite-aid-banned-using-ai-facial-recognition-after-ftc-says-retailer-deployed-technology-without",risk_tag:"Discrimination Risk"},{branch_id:"B135",decision:"prohibit adverse action based only on a facial-recognition match",consequence:"This choice changes how the technology is designed, operated, or supported. The benefit has to be weighed against usability, technical feasibility, scale, and unintended consequences. The central tradeoff is: Loss prevention and employee safety vs. accuracy, discrimination, privacy, and due process. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person..",consequence_type:"TRADEOFF",consequence_basis_example:"2023 Rite Aid facial-recognition enforcement",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2023/12/rite-aid-banned-using-ai-facial-recognition-after-ftc-says-retailer-deployed-technology-without",risk_tag:"Due Process Risk"},{branch_id:"B136",decision:"do not deploy until accuracy and governance controls are adequate",consequence:"This choice changes how the technology is designed, operated, or supported. The benefit has to be weighed against usability, technical feasibility, scale, and unintended consequences. The central tradeoff is: Loss prevention and employee safety vs. accuracy, discrimination, privacy, and due process. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person..",consequence_type:"TRADEOFF",consequence_basis_example:"2023 Rite Aid facial-recognition enforcement",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2023/12/rite-aid-banned-using-ai-facial-recognition-after-ftc-says-retailer-deployed-technology-without",risk_tag:"Loss Prevention Risk"}],id:"S133"},{role:"Retail Executive",role_category:"Product & Technology Leader",situation:"You are the Retail Executive. You are responsible for how the technology is designed, implemented, supported, and changed. Retail theft is increasing. Facial recognition could alert employees when a suspected repeat offender enters a store, but false matches may cause innocent customers to be followed, removed, or reported to police.",core_tradeoff:"Loss prevention and employee safety vs. accuracy, discrimination, privacy, and due process. From this role, weigh technical feasibility, design choices, usability, scale, and unintended consequences.",theme:"AI governance; algorithmic bias; surveillance; human oversight",class_reading_connection:null,real_world_example:"2023 Rite Aid facial-recognition enforcement",what_actually_happened:"The FTC alleged Rite Aid deployed facial recognition without adequate safeguards, producing false positives and harms to consumers, with disproportionate impacts in some communities.",real_world_source:"https://www.ftc.gov/news-events/news/press-releases/2023/12/rite-aid-banned-using-ai-facial-recognition-after-ftc-says-retailer-deployed-technology-without",real_world_image:null,decisions:[{branch_id:"B137",decision:"Deploy broadly",consequence:"Deploying the facial recognition system broadly preserves its full loss-prevention value, giving employees the earliest possible warning about a suspected repeat offender. The tradeoff is that false matches will happen at scale, meaning innocent customers can be wrongly followed, removed, or reported before the system's accuracy is fully proven.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Civil Liberties Risk"},{branch_id:"B138",decision:"pilot with human verification",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In iTutorGroup automated age discrimination, The EEOC alleged iTutorGroup programmed application software to automatically reject female applicants 55 or older and male applicants 60 or older, affecting more than 200 qualified applicants. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"iTutorGroup automated age discrimination",consequence_source:"https://www.eeoc.gov/newsroom/itutorgroup-pay-365000-settle-eeoc-discriminatory-hiring-suit",risk_tag:"Discrimination Risk"},{branch_id:"B139",decision:"prohibit enforcement actions based only on matches",consequence:"You gain the design, usability, speed, or technical benefit of this option, but the unresolved effects become part of the product's design responsibility. The central tradeoff is: Loss prevention and employee safety vs. accuracy, discrimination, privacy, and due process.",consequence_type:"TRADEOFF",consequence_basis_example:"2023 Rite Aid facial-recognition enforcement",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2023/12/rite-aid-banned-using-ai-facial-recognition-after-ftc-says-retailer-deployed-technology-without",risk_tag:"Due Process Risk"},{branch_id:"B140",decision:"do not deploy",consequence:"You gain the design, usability, speed, or technical benefit of this option, but the unresolved effects become part of the product's design responsibility. The central tradeoff is: Loss prevention and employee safety vs. accuracy, discrimination, privacy, and due process.",consequence_type:"TRADEOFF",consequence_basis_example:"2023 Rite Aid facial-recognition enforcement",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2023/12/rite-aid-banned-using-ai-facial-recognition-after-ftc-says-retailer-deployed-technology-without",risk_tag:"Loss Prevention Risk"}],id:"S137"},{role:"Regulator",role_category:"Government & Regulator",situation:"You are the Regulator. You are responsible for deciding what oversight, legal authority, or public protections are appropriate. Retail theft is increasing. Facial recognition could alert employees when a suspected repeat offender enters a store, but false matches may cause innocent customers to be followed, removed, or reported to police.",core_tradeoff:"Loss prevention and employee safety vs. accuracy, discrimination, privacy, and due process. From this role, weigh public interest, rights, safety, proportionality, and oversight.",theme:"AI governance; algorithmic bias; surveillance; human oversight",class_reading_connection:null,real_world_example:"2023 Rite Aid facial-recognition enforcement",what_actually_happened:"The FTC alleged Rite Aid deployed facial recognition without adequate safeguards, producing false positives and harms to consumers, with disproportionate impacts in some communities.",real_world_source:"https://www.ftc.gov/news-events/news/press-releases/2023/12/rite-aid-banned-using-ai-facial-recognition-after-ftc-says-retailer-deployed-technology-without",real_world_image:null,decisions:[{branch_id:"B141",decision:"Allow deployment under existing rules",consequence:"This choice changes the balance between public benefit and intervention. The benefit has to be weighed against rights, proportionality, oversight, and public trust. The central tradeoff is: Loss prevention and employee safety vs. accuracy, discrimination, privacy, and due process. From this role, weigh public interest, rights, safety, proportionality, and oversight..",consequence_type:"TRADEOFF",consequence_basis_example:"2023 Rite Aid facial-recognition enforcement",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2023/12/rite-aid-banned-using-ai-facial-recognition-after-ftc-says-retailer-deployed-technology-without",risk_tag:"Civil Liberties Risk"},{branch_id:"B142",decision:"allow a limited pilot with human verification and reporting",consequence:"This choice changes the balance between public benefit and intervention. The benefit has to be weighed against rights, proportionality, oversight, and public trust. The central tradeoff is: Loss prevention and employee safety vs. accuracy, discrimination, privacy, and due process. From this role, weigh public interest, rights, safety, proportionality, and oversight..",consequence_type:"TRADEOFF",consequence_basis_example:"2023 Rite Aid facial-recognition enforcement",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2023/12/rite-aid-banned-using-ai-facial-recognition-after-ftc-says-retailer-deployed-technology-without",risk_tag:"Discrimination Risk"},{branch_id:"B143",decision:"prohibit enforcement actions based only on a match",consequence:"This choice changes the balance between public benefit and intervention. The benefit has to be weighed against rights, proportionality, oversight, and public trust. The central tradeoff is: Loss prevention and employee safety vs. accuracy, discrimination, privacy, and due process. From this role, weigh public interest, rights, safety, proportionality, and oversight..",consequence_type:"TRADEOFF",consequence_basis_example:"2023 Rite Aid facial-recognition enforcement",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2023/12/rite-aid-banned-using-ai-facial-recognition-after-ftc-says-retailer-deployed-technology-without",risk_tag:"Due Process Risk"},{branch_id:"B144",decision:"restrict or prohibit deployment until safeguards are demonstrated",consequence:"This choice changes the balance between public benefit and intervention. The benefit has to be weighed against rights, proportionality, oversight, and public trust. The central tradeoff is: Loss prevention and employee safety vs. accuracy, discrimination, privacy, and due process. From this role, weigh public interest, rights, safety, proportionality, and oversight..",consequence_type:"TRADEOFF",consequence_basis_example:"2023 Rite Aid facial-recognition enforcement",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2023/12/rite-aid-banned-using-ai-facial-recognition-after-ftc-says-retailer-deployed-technology-without",risk_tag:"Loss Prevention Risk"}],id:"S141"},{role:"Consumer",role_category:"Individual",situation:"You are the Consumer. You are directly affected by the organization's or government's decision and must decide what level of privacy, safety, convenience, or control you are willing to accept. Your company possesses precise customer location data that third parties will pay to access for services such as roadside assistance, fraud prevention, and advertising.",core_tradeoff:"Useful services/revenue vs. location privacy and control over downstream sharing. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person.",theme:"Location privacy; third-party data sharing; consent; accountability",class_reading_connection:null,real_world_example:"2024 FCC wireless-carrier location-data fines",what_actually_happened:"The FCC fined major U.S. wireless carriers nearly $200 million for illegally sharing access to customers' location information without proper consent and safeguards.",real_world_source:"https://docs.fcc.gov/public/attachments/DOC-402213A1.pdf",real_world_image:null,decisions:[{branch_id:"B145",decision:"Allow location-data use when you explicitly consent to each purpose",consequence:"This choice gives you some combination of access, convenience, safety, privacy, or control, while leaving you to accept the corresponding personal tradeoff. The central tradeoff is: Useful services/revenue vs. location privacy and control over downstream sharing. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person..",consequence_type:"TRADEOFF",consequence_basis_example:"2024 FCC wireless-carrier location-data fines",consequence_source:"https://docs.fcc.gov/public/attachments/DOC-402213A1.pdf",risk_tag:"Consent Risk"},{branch_id:"B146",decision:"allow limited third-party access for services you choose",consequence:"This choice gives you some combination of access, convenience, safety, privacy, or control, while leaving you to accept the corresponding personal tradeoff. The central tradeoff is: Useful services/revenue vs. location privacy and control over downstream sharing. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person..",consequence_type:"TRADEOFF",consequence_basis_example:"2024 FCC wireless-carrier location-data fines",consequence_source:"https://docs.fcc.gov/public/attachments/DOC-402213A1.pdf",risk_tag:"Location Privacy Risk"},{branch_id:"B147",decision:"opt out of external location- ountability",class_reading_connection:null,real_world_example:"2024 FCC wireless-carrier location-data fines",what_actually_happened:"The FCC fined major U.S. wireless carriers nearly $200 million for illegally sharing access to customers' location information without proper consent and safeguards.",real_world_source:"https://docs.fcc.gov/public/attachments/DOC-402213A1.pdf",real_world_image:null,decisions:[{branch_id:"B149",decision:"Require explicit consent for each use",consequence:"This choice lines up with the documented response in this case. The FCC fined major U.S. wireless carriers nearly $200 million for illegally sharing access to customers' location information without proper consent and safeguards. The consequence is therefore grounded in what actually occurred rather than a simulated result.",consequence_type:"DIRECT_REAL_WORLD",consequence_basis_example:"2024 FCC wireless-carrier location-data fines",consequence_source:"https://docs.fcc.gov/public/attachments/DOC-402213A1.pdf",risk_tag:"Consent Risk"},{branch_id:"B150",decision:"permit vetted third-party access",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Carpenter v. United States and historical cell-site location data, The U.S. Supreme Court held in Carpenter v. United States that obtaining at least seven days of historical cell-site location information generally constitutes a Fourth Amendment search requiring a warrant. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"Carpenter v. United States and historical cell-site location data",consequence_source:"https://www.supremecourt.gov/opinions/17pdf/16-402_h315.pdf",risk_tag:"Location Privacy Risk"},{branch_id:"B151",decision:"sell access with contractual controls",consequence:"A comparable real-world case shows the kind of consequence this choice can cr llions of smart TVs without adequate knowledge or consent and shared data for advertising-related purposes. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"2017 VIZIO smart-TV viewing-data settlement",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2017/02/vizio-pay-22-million-ftc-state-new-jersey-settle-charges-it-collected-viewing-histories-11-million",risk_tag:"Data Control Risk"},{branch_id:"B156",decision:"prohibit external location-data sharing",consequence:"You gain the design, usability, speed, or technical benefit of this option, but the unresolved effects become part of the product's design responsibility. The central tradeoff is: Useful services/revenue vs. location privacy and control over downstream sharing.",consequence_type:"TRADEOFF",consequence_basis_example:"2024 FCC wireless-carrier location-data fines",consequence_source:"https://docs.fcc.gov/public/attachments/DOC-402213A1.pdf",risk_tag:"Revenue Risk"}],id:"S153"},{role:"CISO",role_category:"Security & Privacy Leader",situation:"You are the CISO. You are responsible for identifying the privacy and security risk, recommending controls, and explaining the residual risk to leadership. Customers strongly value a simple claim that your communications product is end-to-end encrypted, but the actual architecture gives your company more technical access than customers may assume.",core_tradeoff:"Competitive marketing and usability vs. truthful security claims and user trust. From this role, weigh privacy/security risk, control effectiveness, residual risk, and duty of care.",theme:"Security transparency; trust; encryption; corporate accountability",class_reading_connection:null,real_world_example:"2020 FTC Zoom security settlement",what_actually_happened:"The FTC alleged Zoom made misleading claims about end-to-end encryption and other deoff is that investors and the public go longer without knowing the true scope of the risk the company is carrying.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Business Continuity Risk"},{branch_id:"B180",decision:"minimize disclosure to avoid market impact",consequence:"Minimizing disclosure preserves investor confidence and market stability in the short term. The tradeoff is that shareholders and the public make decisions without a full picture of the company's cybersecurity risk, which can look like a cover-up if the truth comes out later.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Legal Risk"}],id:"S177"},{role:"User",role_category:"Individual",situation:"You are the User. You are directly affected by the organization's or government's decision and must decide what level of privacy, safety, convenience, or control you are willing to accept. Your team can learn whether emotions spread online by quietly changing which positive or negative posts hundreds of thousands of users see. The experiment could improve understanding of online behavior, but users would not knowingly opt into the manipulation.",core_tradeoff:"Research value and product knowledge vs. informed consent, autonomy, and manipulation of users. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person.",theme:"Research ethics; informed consent; platform power; algorithmic manipulation",class_reading_connection:"Yes — Experimental Evidence of Massive-Scale Emotional Contagion Through Social Networks and assigned press coverage",real_world_example:"Facebook emotional contagion experiment (2012/2014)",what_actually_happened:"Facebook altered News Feed exposure for 689,003 users to test emotional contagion. The published study triggered controversy over informed consent, opt-out rights, and the different ethical standards applied to corporate and academic research.",real_world_source:"https://www.pnas.org/doi/10.1073/pnas.1320040111",real_world_image:null,decisions:[{branch_id:"B181",decision:"Accept platform experimentation under the existing terms of service",consequence:"This choice gives you some combination of access, convenience, safety, privacy, or control, while leaving you to accept the corresponding personal tradeoff. The central tradeoff is: Research value and product knowledge vs. informed consent, autonomy, and manipulation of users. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person..",consequence_type:"TRADEOFF",consequence_basis_example:"Facebook emotional contagion experiment (2012/2014)",consequence_source:"https://www.pnas.org/doi/10.1073/pnas.1320040111",risk_tag:"Informed Consent Risk"},{branch_id:"B182",decision:"participate only when explicit informed consent is requested",consequence:"This choice gives you some combination of access, convenience, safety, privacy, or control, while leaving you to accept the corresponding personal tradeoff. The central tradeoff is: Research value and product knowledge vs. informed consent, autonomy, and manipulation of users. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person..",consequence_type:"TRADEOFF",consequence_basis_example:"Facebook emotional contagion experiment (2012/2014)",consequence_source:"https://www.pnas.org/doi/10.1073/pnas.1320040111",risk_tag:"Research Value Risk"},{branch_id:"B183",decision:"opt out of research or personalization experiments where possible",consequence:"This choice gives you some combination of access, convenience, safety, privacy, or control, while leaving you to accept the corresponding personal tradeoff. The central tradeoff is: Research value and product knowledge vs. informed consent, autonomy, and manipulation of users. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person..",consequence_type:"TRADEOFF",consequence_basis_example:"Facebook emotional contagion experiment (2012/2014)",consequence_source:"https://www.pnas.org/doi/10.1073/pnas.1320040111",risk_tag:"Autonomy Risk"},{branch_id:"B184",decision:"stop or reduce platform use if experimentation without meaningful consent is unacceptable",consequence:"This choice gives you some combination of access, convenience, safety, privacy, or control, while leaving you to accept the corresponding personal tradeoff. The central tradeoff is: Research value and product knowledge vs. informed consent, autonomy, and manipulation of users. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person..",consequence_type:"TRADEOFF",consequence_basis_example:"Facebook emotional contagion experiment (2012/2014)",consequence_source:"https://www.pnas.org/doi/10.1073/pnas.1320040111",risk_tag:"Product Knowledge Risk"}],id:"S181"},{role:"Privacy Officer",role_category:"Security & Privacy Leader",situation:"You are the Privacy Officer. You are responsible for identifying the privacy and security risk, recommending controls, and explaining the residual risk to leadership. Your team can learn whether emotions spread online by quietly changing which positive or negative posts hundreds of thousands of users see. The experiment could improve understanding of online behavior, but users would not knowingly opt into the manipulation.",core_tradeoff:"Research value and product knowledge vs. informed consent, autonomy, and manipulation of users. From this role, weigh privacy/security risk, control effectiveness, residual risk, and duty of care.",theme:"Research ethics; informed consent; platform power; algorithmic manipulation",class_reading_connection:"Yes — Experimental Evidence of Massive-Scale Emotional Contagion Through Social Networks and assigned press coverage",real_world_example:"Facebook emotional contagion experiment (2012/2014)",what_actually_happened:"Facebook altered News Feed exposure for 689,003 users to test emotional contagion. The published study triggered controversy over informed consent, opt-out rights, and the different ethical standards applied to corporate and academic research.",real_world_source:"https://www.pnas.org/doi/10.1073/pnas.1320040111",real_world_image:null,decisions:[{branch_id:"B185",decision:"Run the experiment under the platform terms of service",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Cambridge Analytica / Facebook data harvesting, The FTC alleged Facebook data from tens of millions of users was deceptively harvested and used by Cambridge Analytica for voter profiling and targeting. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"Cambridge Analytica / Facebook data harvesting",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2019/07/ftc-sues-cambridge-analytica-settles-former-ceo-app-developer",risk_tag:"Informed Consent Risk"},{branch_id:"B186",decision:"require explicit informed consent",consequence:"This choice lines up with the documented response in this case. Facebook altered News Feed exposure for 689,003 users to test emotional contagion. The published study triggered controversy over informed consent, opt-out rights, and the different ethical standards applied to corporate and academic research. The consequence is therefore grounded in what actually occurred rather than a simulated result.",consequence_type:"DIRECT_REAL_WORLD",consequence_basis_example:"Facebook emotional contagion experiment (2012/2014)",consequence_source:"https://www.pnas.org/doi/10.1073/pnas.1320040111",risk_tag:"Research Value Risk"},{branch_id:"B187",decision:"run a smaller opt-in study",consequence:"This choice lines up with the documented response in this case. Facebook altered News Feed exposure for 689,003 users to test emotional contagion. The published study triggered controversy over informed consent, opt-out rights, and the different ethical standards applied to corporate and academic research. The consequence is therefore grounded in what actually occurred rather than a simulated result.",consequence_type:"DIRECT_REAL_WORLD",consequence_basis_example:"Facebook emotional contagion experiment (2012/2014)",consequence_source:"https://www.pnas.org/doi/10.1073/pnas.1320040111",risk_tag:"Autonomy Risk"},{branch_id:"B188",decision:"do not conduct the experiment",consequence:"Deciding not to conduct the experiment preserves users' ability to see their feed shaped by ordinary factors rather than a deliberate, undisclosed manipulation. The tradeoff is that the research question, whether emotions genuinely spread through a social network, goes unanswered, at least by this method.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Product Knowledge Risk"}],id:"S185"},{role:"Researcher",role_category:"Product & Technology Leader",situation:"You are the Researcher. You are responsible for how the technology is designed, implemented, supported, and changed. Your team can learn whether emotions spread online by quietly changing which positive or negative posts hundreds of thousands of users see. The experiment could improve understanding of online behavior, but users would not knowingly opt into the manipulation.",core_tradeoff:"Research value and product knowledge vs. informed consent, autonomy, and manipulation of users. From this role, weigh technical feasibility, design choices, usability, scale, and unintended consequences.",theme:"Research ethics; informed consent; platform power; algorithmic manipulation",class_reading_connection:"Yes — Experimental Evidence of Massive-Scale Emotional Contagion Through Social Networks and assigned press coverage",real_world_example:"Facebook emotional contagion ex world_example:"Gender-neutral STEM ads delivered disproportionately to men",what_actually_happened:"A field test across 191 countries found that a STEM careers ad intended to be gender neutral was shown to more men because younger women were more expensive advertising targets. Women who saw the ad were actually more likely to click, illustrating how apparently neutral economic optimization can produce unequal outcomes.",real_world_source:"https://doi.org/10.1287/mnsc.2018.3093",real_world_image:null,decisions:[{branch_id:"B193",decision:"Let the cost-optimizing algorithm continue",consequence:"You preserve or advance the organizational objective behind this option, but leadership owns the resulting business, reputational, and accountability exposure. The central tradeoff is: Economic efficiency vs. equitable access to opportunities and unintended discriminatory outcomes.",consequence_type:"TRADEOFF",consequence_basis_example:"Gender-neutral STEM ads delivered disproportionately to men",consequence_source:"https://doi.org/10.1287/mnsc.2018.3093",risk_tag:"Discrimination Risk"},{branch_id:"B194",decision:"require equal distribution across genders",consequence:"Requiring equal distribution across genders preserves the intent of the gender-neutral campaign and makes sure the opportunity actually reaches the audience it was designed for. The tradeoff is that overriding the algorithm's cost optimization makes the campaign more expensive to run for the same result.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Economic Efficiency Risk"},{branch_id:"B195",decision:"increase the budget to reach the more expensive audience",consequence:"Increasing the budget preserves the algorithm's normal optimization process while still closing the gap in who sees the opportunity. The tradeoff is a higher campaign cost, and it treats the symptom of the disparity rather than the underlying reason the algorithm found women more expensive to reach.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Financial Risk"},{branch_id:"B196",decision:"stop the campaign until the disparity is understood",consequence:"You preserve or advance the organizational objective behind this option, but leadership owns the resulting business, reputational, and accountability exposure. The central tradeoff is: Economic efficiency vs. equitable access to opportunities and unintended discriminatory outcomes.",consequence_type:"TRADEOFF",consequence_basis_example:"Gender-neutral STEM ads delivered disproportionately to men",consequence_source:"https://doi.org/10.1287/mnsc.2018.3093",risk_tag:"Business Continuity Risk"}],id:"S193"},{role:"Algorithm/Product Owner",role_category:"Product & Technology Leader",situation:"You are the Algorithm/Product Owner. You are responsible for how the technology is designed, implemented, supported, and changed. You are running a gender-neutral campaign intended to encourage people to pursue STEM careers. Your ad platform optimizes delivery for cost and performance, but monitoring shows substantially more men than women are seeing the opportunity.",core_tradeoff:"Economic efficiency vs. equitable access to opportunities and unintended discriminatory outcomes. From this role, weigh technical feasibility, design choices, usability, scale, and unintended consequences.",theme:"Algorithmic bias; disparate impact; optimization; employment opportunity",class_reading_connection:"Yes — Lambrecht and Tucker, Algorithmic Bias? An Empirical Study of Apparent Gender-Based Discrimination in the Display of STEM Career Ads",real_world_example:"Gender-neutral STEM ads delivered disproportionately to men",what_actually_happened:"A field test across 191 countries found that a STEM careers ad intended to be gender neutral was shown to more men because younger women were more expensive advertising targets. Women who saw the ad were actually more likely to click, illustrating ho ibility. The central tradeoff is: Economic efficiency vs. equitable access to opportunities and unintended discriminatory outcomes.",consequence_type:"TRADEOFF",consequence_basis_example:"Gender-neutral STEM ads delivered disproportionately to men",consequence_source:"https://doi.org/10.1287/mnsc.2018.3093",risk_tag:"Business Continuity Risk"}],id:"S197"},{role:"Regulator",role_category:"Government & Regulator",situation:"You are the Regulator. You are responsible for deciding what oversight, legal authority, or public protections are appropriate. You are running a gender-neutral campaign intended to encourage people to pursue STEM careers. Your ad platform optimizes delivery for cost and performance, but monitoring shows substantially more men than women are seeing the opportunity.",core_tradeoff:"Economic efficiency vs. equitable access to opportunities and unintended discriminatory outcomes. From this role, weigh public interest, rights, safety, proportionality, and oversight.",theme:"Algorithmic bias; disparate impact; optimization; employment opportunity",class_reading_connection:"Yes — Lambrecht and Tucker, Algorithmic Bias? An Empirical Study of Apparent Gender-Based Discrimination in the Display of STEM Career Ads",real_world_example:"Gender-neutral STEM ads delivered disproportionately to men",what_actually_happened:"A field test across 191 countries found that a STEM careers ad intended to be gender neutral was shown to more men because younger women were more expensive advertising targets. Women who saw the ad were actually more likely to click, illustrating how apparently neutral economic optimization can produce unequal outcomes.",real_world_source:"https://doi.org/10.1287/mnsc.2018.3093",real_world_image:null,decisions:[{branch_id:"B201",decision:"Let the cost-optimizing algorithm continue",consequence:"You gain the public-policy or enforcement benefit of this option, but you also accept its effect on rights, proportionality, oversight, and public trus logy Leader",situation:"You are the Security Researcher. You are responsible for how the technology is designed, implemented, supported, and changed. Your security research team discovers a practical way to identify users of an anonymity network used by criminals, journalists, dissidents, and ordinary privacy-conscious users. Publishing the method could improve security research but could also expose people who depend on anonymity for safety.",core_tradeoff:"Security research and law-enforcement value vs. anonymity, personal safety, responsible disclosure, and dual use. From this role, weigh technical feasibility, design choices, usability, scale, and unintended consequences.",theme:"Anonymity; responsible disclosure; dual-use research; research ethics",class_reading_connection:"Yes — assigned Tor/Carnegie Mellon Black Hat reading",real_world_example:"Carnegie Mellon Tor deanonymization research / cancelled Black Hat 2014 talk",what_actually_happened:"A planned 2014 Black Hat talk by Carnegie Mellon researchers titled 'You Don't Have to be the NSA to Break Tor: Deanonymizing Users on a Budget' was cancelled after university legal counsel said the materials were not approved for public release.",real_world_source:"https://www.blackhat.com/latestintel/07212014-a-schedule-update.html",real_world_image:null,decisions:[{branch_id:"B205",decision:"Publish the technique publicly",consequence:"Publishing the technique publicly preserves open scientific practice and lets the wider security community scrutinize, replicate, and build defenses against the method. The tradeoff is that the same publication hands the technique to anyone who might use it to unmask journalists, dissidents, or other people who depend on anonymity for their safety.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Dual Use Risk"},{branch_id:"B206",decision:"disclose privately to the Tor Project first",consequence:"Disclosing privately to the Tor Project firs _Program%20-%20Completed%20508%20-%2011292022.pdf",risk_tag:"Government Power Risk"},{branch_id:"B311",decision:"limit collection to known targets and contacts",consequence:"This choice lines up with the documented response in this case. The Privacy and Civil Liberties Oversight Board reviewed the Section 215 bulk telephone-records program and recommended ending it, citing legal, constitutional, privacy, and civil-liberties concerns and limited demonstrated value. The USA FREEDOM Act later ended the prior bulk-collection model. The consequence is therefore grounded in what actually occurred rather than a simulated result.",consequence_type:"DIRECT_REAL_WORLD",consequence_basis_example:"NSA Section 215 bulk telephone metadata program",consequence_source:"https://documents.pclob.gov/prod/Documents/OversightReport/cf0ce183-7935-4b06-bb41-007d1f437412/215-Report_on_the_Telephone_Records_Program%20-%20Completed%20508%20-%2011292022.pdf",risk_tag:"Privacy Risk"},{branch_id:"B312",decision:"end the capability",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In NSA Section 215 bulk telephone metadata program, The Privacy and Civil Liberties Oversight Board reviewed the Section 215 bulk telephone-records program and recommended ending it, citing legal, constitutional, privacy, and civil-liberties concerns and limited demonstrated value. The USA FREEDOM Act later ended the prior bulk-collection model. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"NSA Section 215 bulk telephone metadata program",consequence_source:"https://documents.pclob.gov/prod/Documents/OversightReport/cf0ce183-7935-4b06-bb41-007d1f437412/215-Report_on_the_Telephone_Records_Program%20-%20Completed%20508%20-%2011292022.pdf",risk_tag:"Intelligence Value Risk"}],id:"S309"},{role:"Security Engineer",role_category:"Product & Technology Leader",situation:"You are the Security Engineer. You are responsible for how the technology is designed, implemented, supported, and changed. Your encrypted communications service is being blocked by governments. Engineers can disguise connections so blocking your service would require governments to block major cloud services too, but the technique relies on infrastructure providers in ways they may not permit.",core_tradeoff:"Access to private communication and resistance to censorship vs. provider rules, infrastructure trust, and government authority. From this role, weigh technical feasibility, design choices, usability, scale, and unintended consequences.",theme:"Censorship; encrypted communications; domain fronting; platform power",class_reading_connection:"Yes — domain-fronting / Egypt and UAE material discussed in the course",real_world_example:"Signal domain fronting to bypass censorship in Egypt and UAE",what_actually_happened:"Signal deployed domain fronting after service blocking in Egypt and the UAE so Signal traffic appeared to be traffic for large uncensored domains. Changes and enforcement by major cloud providers later made that approach largely non-viable.",real_world_source:"https://signal.org/blog/doodles-stickers-censorship/",real_world_image:"https://signal.org/blog/images/censorship.jpg",decisions:[{branch_id:"B313",decision:"Deploy domain fronting",consequence:"This choice lines up with the documented response in this case. Signal deployed domain fronting after service blocking in Egypt and the UAE so Signal traffic appeared to be traffic for large uncensored domains. Changes and enforcement by major cloud providers later made that approach largely non-viable. The consequence is therefore grounded in what actually occurred rather than a simulated result.",consequence_type:"DIRECT_REAL_WORLD",consequence_basis_example:"Signal domain fronting to bypass censorship in Egypt and UAE",consequence_source:"https://signal.org/blog/doodles-stickers-censorship/",risk_tag:"Provider Trust Risk"},{branch_id:"B314",decision:"negotiate with cloud providers first",consequence:"Negotiating with cloud providers first preserves the service's relationship with the infrastructure it depends on and avoids using a technique the providers have not agreed to. The tradeoff is that negotiation takes time the service's blocked users may not have, and there is no guarantee the providers agree to the arrangement at all.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Communication Access Risk"},{branch_id:"B315",decision:"tell users to rely on VPN/Tor instead",consequence:"Telling users to rely on VPN or Tor instead preserves the service's own infrastructure and relationships without taking on the risk of a workaround the cloud providers might object to. The tradeoff is that it shifts the burden of evading censorship onto individual users, many of whom will not have the technical knowledge or access to do it safely.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Government Authority Risk"},{branch_id:"B316",decision:"comply with the blocking governments",consequence:"Complying with the blocking governments preserves the company's standing and legal footing in the countries where it operates. The tradeoff is that people in those countries lose access to encrypted communication precisely when they may need it most.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Censorship Risk"}],id:"S313"},{role:"Government Official",role_category:"Government & Regulator",situation:"You are the Government Official. You are responsible for deciding what oversight, legal authority, or public protections are appropriate. Your encrypted communications service is being blocked by governments. Engineers can disguise connections so blocking your service would require governments to block major cloud services too, but the technique relies on infrastructure providers in ways they may not permit.",core_tradeoff:"Access to private communication and resistance to censorship vs. provider rules, infrastructure trust, and government authority. From this role, weigh public interest, rights, safety, proportionality, and oversight.",theme:"Censorship; encrypted communications; domain fronting; platform power",class_reading_connection:"Yes — domain-fronting / Egypt and UAE material discussed in the course",real_world_example:"Signal domain fronting to bypass censorship in Egypt and UAE",what_actually_happened:"Signal deployed domain fronting after service blocking in Egypt and the UAE so Signal traffic appeared to be traffic for large uncensored domains. Changes and enforcement by major cloud providers later made that approach largely non-viable.",real_world_source:"https://signal.org/blog/doodles-stickers-censorship/",real_world_image:"https://signal.org/blog/images/censorship.jpg",decisions:[{branch_id:"B317",decision:"Deploy domain fronting",consequence:"This choice lines up with the documented response in this case. Signal deployed domain fronting after service blocking in Egypt and the UAE so Signal traffic appeared to be traffic for large uncensored domains. Changes and enforcement by major cloud providers later made that approach largely non-viable. The consequence is therefore grounded in what actually occurred rather than a simulated result.",consequence_type:"DIRECT_REAL_WORLD",consequence_basis_example:"Signal domain fronting to bypass censorship in Egypt and UAE",consequence_source:"https://signal.org/blog/doodles-stickers-censorship/",risk_tag:"Provider Trust Risk"},{branch_id:"B318",decision:"negotiate with cloud providers first",consequence:"Negotiating with cloud providers first preserves the service's relationship with the infrastructure it depends on and avoids using a technique the providers have not agreed to. The tradeoff is that negotiation takes time the service's blocked users may not have, and there is no guarantee the providers agree to the arrangement at all.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Communication Access Risk"},{branch_id:"B319",decision:"tell users to rely on VPN/Tor instead",consequence:"Telling users to rely on VPN or Tor instead preserves the service's own infrastructure and relationships without taking on the risk of a workaround the cloud providers might object to. The tradeoff is that it shifts the burden of evading censorship onto individual users, many of whom will not have the technical knowledge or access to do it safely.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Government Authority Risk"},{branch_id:"B320",decision:"comply with the blocking governments",consequence:"Complying with the blocking governments preserves the company's standing and legal footing in the countries where it operates. The tradeoff is that people in those countries lose access to encrypted communication precisely when they may need it most.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Censorship Risk"}],id:"S317"},{role:"User/Journalist",role_category:"Individual",situation:"You are the User/Journalist. You are directly affected by the organization's or government's decision and must decide what level of privacy, safety, convenience, or control you are willing to accept. Your encrypted communications service is being blocked by governments. Engineers can disguise connections so blocking your service would require governments to block major cloud services too, but the technique relies on infrastructure providers in ways they may not permit.",core_tradeoff:"Access to private communication and resistance to censorship vs. provider rules, infrastructure trust, and government authority. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person.",theme:"Censorship; encrypted communications; domain fronting; platform power",class_reading_connection:"Yes — domain-fronting / Egypt and UAE material discussed in the course",real_world_example:"Signal domain fronting to bypass censorship in Egypt and UAE",what_actually_happened:"Signal deployed domain fronting after service blocking in Egypt and the UAE so Signal traffic appeared to be traffic for large uncensored domains. Changes and enforcement by major cloud providers later made that approach largely non-viable.",real_world_source:"https://signal.org/blog/doodles-stickers-censorship/",real_world_image:"https://signal.org/blog/images/censorship.jpg",decisions:[{branch_id:"B321",decision:"Use domain fronting when available to reach the service",consequence:"This choice gives you some combination of access, convenience, safety, privacy, or control, while leaving you to accept the corresponding personal tradeoff. The central tradeoff is: Access to private communication and resistance to censorship vs. provider rules, infrastructure trust, and government authority. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person..",consequence_type:"TRADEOFF",consequence_basis_example:"Signal domain fronting to bypass censorship in Egypt and UAE",consequence_source:"https://signal.org/blog/doodles-stickers-censorship/",risk_tag:"Provider Trust Risk"},{branch_id:"B322",decision:"use VPN or Tor instead",consequence:"This choice gives you some combination of access, convenience, safety, privacy, or control, while leaving you to accept the corresponding personal tradeoff. The central tradeoff is: Access to private communication and resistance to censorship vs. provider rules, infrastructure trust, and government authority. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person..",consequence_type:"TRADEOFF",consequence_basis_example:"Signal domain fronting to bypass censorship in Egypt and UAE",consequence_source:"https://signal.org/blog/doodles-stickers-censorship/",risk_tag:"Communication Access Risk"},{branch_id:"B323",decision:"use conventional access methods and accept that the service may be blocked",consequence:"This choice gives you some combination of access, convenience, safety, privacy, or control, while leaving you to accept the corresponding personal tradeoff. The central tradeoff is: Access to private communication and resistance to censorship vs. provider rules, infrastructure trust, and government authority. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person..",consequence_type:"TRADEOFF",consequence_basis_example:"Signal domain fronting to bypass censorship in Egypt and UAE",consequence_source:"https://signal.org/blog/doodles-stickers-censorship/",risk_tag:"Government Authority Risk"},{branch_id:"B324",decision:"avoid the service if circumvention creates unacceptable personal or legal risk",consequence:"This choice gives you some combination of access, convenience, safety, privacy, or control, while leaving you to accept the corresponding personal tradeoff. The central tradeoff is: Access to private communication and resistance to censorship vs. provider rules, infrastructure trust, and government authority. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person..",consequence_type:"TRADEOFF",consequence_basis_example:"Signal domain fronting to bypass censorship in Egypt and UAE",consequence_source:"https://signal.org/blog/doodles-stickers-censorship/",risk_tag:"Censorship Risk"}],id:"S321"},{role:"Privacy Officer",role_category:"Security & Privacy Leader",situation:"You are the Privacy Officer. You are responsible for identifying the privacy and security risk, recommending controls, and explaining the residual risk to leadership. Your company wants to release a large dataset to researchers to accelerate innovation. Names and obvious identifiers have been removed, and the data appears anonymous, but outside information may allow records to be linked back to individuals.",core_tradeoff:"Open research and innovation vs. re-identification risk and loss of control over sensitive information. From this role, weigh privacy/security risk, control effectiveness, residual risk, and duty of care.",theme:"Re-identification; anonymization; research data; privacy engineering",class_reading_connection:"Yes — re-identification/anonymization concepts from the privacy readings",real_world_example:"Netflix Prize dataset de-anonymization",what_actually_happened:"Researchers Narayanan and Shmatikov demonstrated that records in the Netflix Prize dataset could be de-anonymized using limited outside knowledge and public IMDb ratings, illustrating the limits of simple anonymization for high-dimensional data.",real_world_source:"https://www.cs.cornell.edu/~shmat/netflix-faq.html",real_world_image:null,decisions:[{branch_id:"B325",decision:"Release the de-identified dataset publicly",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Netflix Prize dataset de-anonymization, Researchers Narayanan and Shmatikov demonstrated that records in the Netflix Prize dataset could be de-anonymized using limited outside knowledge and public IMDb ratings, illustrating the limits of simple anonymization for high-dimensional data. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"Netflix Prize dataset de-anonymization",consequence_source:"https://www.cs.cornell.edu/~shmat/netflix-faq.html",risk_tag:"Re-Identification Risk"},{branch_id:"B326",decision:"provide controlled researcher access",consequence:"Providing controlled researcher access preserves most of the research value of the dataset while limiting who can obtain it and how it can be used. The tradeoff is that this access model is more expensive to administer and still cannot fully eliminate the risk that a permitted researcher re-identifies someone in the data.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Loss Of Control Risk"},{branch_id:"B327",decision:"add stronger privacy protections that reduce research utility",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Netflix Prize dataset de-anonymization, Researchers Narayanan and Shmatikov demonstrated that records in the Netflix Prize dataset could be de-anonymized using limited outside knowledge and public IMDb ratings, illustrating the limits of simple anonymization for high-dimensional data. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"Netflix Prize dataset de-anonymization",consequence_source:"https://www.cs.cornell.edu/~shmat/netflix-faq.html",risk_tag:"Research Utility Risk"},{branch_id:"B328",decision:"do not release individual-level data",consequence:"Not releasing individual-level data preserves the strongest protection against re-identification, since information that never leaves the company cannot be linked back to a person. The tradeoff is that outside researchers lose the ability to independently verify findings or discover things the company's own analysts might miss.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Open Research Risk"}],id:"S325"},{role:"Researcher",role_category:"Product & Technology Leader",situation:"You are the Researcher. You are responsible for how the technology is designed, implemented, supported, and changed. Your company wants to release a large dataset to researchers to accelerate innovation. Names and obvious identifiers have bee  response in this case. The FTC alleged CafePress used weak security practices and failed to adequately inform consumers about breaches, including exposure of sensitive information. The consequence is therefore grounded in what actually occurred rather than a simulated result.",consequence_type:"DIRECT_REAL_WORLD",consequence_basis_example:"CafePress breach disclosure and security failures",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2022/03/ftc-takes-action-against-cafepress-data-breach-cover",risk_tag:"Control Effectiveness"},{branch_id:"B436",decision:"minimize disclosure to avoid reputational damage",consequence:"Minimizing disclosure preserves the company's reputation and control over the narrative while the investigation is still underway. The tradeoff is that customers go longer without knowing their information may be compromised, losing time they could have used to protect themselves.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Reputational Risk"}],id:"S433"},{role:"Customer",role_category:"Individual",situation:"You are the Customer. You are directly affected by the organization's or government's decision and must decide what level of privacy, safety, convenience, or control you are willing to accept. Your company discovers that attackers accessed customer information. Immediate public disclosure may damage the company and reveal uncertainty before the investigation is complete, while delay leaves customers unable to protect themselves.",core_tradeoff:"Incident accuracy and reputation vs. transparency and customers' ability to protect themselves. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person.",theme:"Breach notification; transparency; security governance; consumer harm",class_reading_connection:"No — outside real-world example",real_world_example:"CafePress breach disclosure and security failures",what_actually_happened:" /16-402_h315.pdf",risk_tag:"Civil Liberties Risk"},{branch_id:"B471",decision:"permit limited emergency access",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In DOJ use of StingRay / cell-site simulator technology, DOJ adopted a 2015 policy generally requiring a probable-cause search warrant for cell-site simulator use and established data-deletion, supervision, auditing, and privacy requirements. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"DOJ use of StingRay / cell-site simulator technology",consequence_source:"https://www.justice.gov/archives/opa/pr/justice-department-announces-enhanced-policy-use-cell-site-simulators",risk_tag:"Proportionality Risk"},{branch_id:"B472",decision:"prohibit long-term location-history acquisition",consequence:"You gain the public-policy or enforcement benefit of this option, but you also accept its effect on rights, proportionality, oversight, and public trust. The central tradeoff is: Investigative capability vs. long-term location privacy and limits of third-party disclosure.",consequence_type:"TRADEOFF",consequence_basis_example:"Carpenter v. United States and historical cell-site location data",consequence_source:"https://www.supremecourt.gov/opinions/17pdf/16-402_h315.pdf",risk_tag:"Public Trust Risk"}],id:"S469"},{role:"Citizen",role_category:"Individual",situation:"You are the Citizen. You are directly affected by the organization's or government's decision and must decide what level of privacy, safety, convenience, or control you are willing to accept. Investigators want months of historical location records from a wireless provider to connect a suspect to multiple crimes. The records already exist with a third party, but they reveal a detailed picture of a person's movements.",core_tradeoff:"Investigative capability vs. long-ter echnical feasibility, design choices, usability, scale, and unintended consequences.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Research Value Risk"},{branch_id:"B516",decision:"allow customers granular retention choices",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In 2017 VIZIO smart-TV viewing-data settlement, The FTC alleged VIZIO collected second-by-second viewing information from millions of smart TVs without adequate knowledge or consent and shared data for advertising-related purposes. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"2017 VIZIO smart-TV viewing-data settlement",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2017/02/vizio-pay-22-million-ftc-state-new-jersey-settle-charges-it-collected-viewing-histories-11-million",risk_tag:"Data Control Risk"}],id:"S513"},{role:"Health-Tech CEO",role_category:"Executive",situation:"You are the Health-Tech CEO. You are responsible for the organization's business decision, reputation, resources, and accountability. Advertising-platform integrations improve marketing attribution and growth, but events and identifiers can reveal that a person is seeking mental-health treatment.",core_tradeoff:"Growth and measurement vs. highly sensitive health privacy and trust. From this role, weigh organizational cost, reputation, business continuity, and accountability.",theme:"Mental-health privacy; advertising technology; consent; secondary use",class_reading_connection:"No — outside real-world example",real_world_example:"Cerebral online mental-health data used for advertising",what_actually_happened:"The FTC alleged Cerebral disclosed sensitive consumer information for advertising and failed to honor privacy and cancellation commitments.",real_world_source:"https://www.ftc.gov/legal-library/browse/cases-proceedings/222-3067-cerebral-inc-kyle-robertson-us-v",real_world_image:null,decisions:[{branch_id:"B517",decision:"Use standard ad-tech integrations",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Cambridge Analytica / Facebook data harvesting, The FTC alleged Facebook data from tens of millions of users was deceptively harvested and used by Cambridge Analytica for voter profiling and targeting. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"Cambridge Analytica / Facebook data harvesting",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2019/07/ftc-sues-cambridge-analytica-settles-former-ceo-app-developer",risk_tag:"Health Privacy Risk"},{branch_id:"B518",decision:"remove obvious clinical fields",consequence:"Removing obvious clinical fields before sending data to ad platforms preserves much of the marketing and growth value of the integration while stripping out the most direct signals of mental-health treatment. The tradeoff is that indirect signals can remain, so removing the obvious fields reduces but does not eliminate the risk that someone's treatment status is inferred.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Data Minimization"},{branch_id:"B519",decision:"require explicit opt-in",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In 2017 VIZIO smart-TV viewing-data settlement, The FTC alleged VIZIO collected second-by-second viewing information from millions of smart TVs without adequate knowledge or consent and shared data for advertising-related purposes. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_t
