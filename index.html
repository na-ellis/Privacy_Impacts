 person..",consequence_type:"TRADEOFF",consequence_basis_example:"Cerebral online mental-health data used for advertising",consequence_source:"https://www.ftc.gov/legal-library/browse/cases-proceedings/222-3067-cerebral-inc-kyle-robertson-us-v",risk_tag:"Informed Consent Risk"},{branch_id:"B524",decision:"choose a provider that does not use treatment-related data for advertising",consequence:"This choice gives you some combination of access, convenience, safety, privacy, or control, while leaving you to accept the corresponding personal tradeoff. The central tradeoff is: Growth and measurement vs. highly sensitive health privacy and trust. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person..",consequence_type:"TRADEOFF",consequence_basis_example:"Cerebral online mental-health data used for advertising",consequence_source:"https://www.ftc.gov/legal-library/browse/cases-proceedings/222-3067-cerebral-inc-kyle-robertson-us-v",risk_tag:"Business Growth Risk"}],id:"S521"},{role:"Privacy Officer",role_category:"Security & Privacy Leader",situation:"You are the Privacy Officer. You are responsible for identifying the privacy and security risk, recommending controls, and explaining the residual risk to leadership. Advertising-platform integrations improve marketing attribution and growth, but events and identifiers can reveal that a person is seeking mental-health treatment.",core_tradeoff:"Growth and measurement vs. highly sensitive health privacy and trust. From this role, weigh privacy/security risk, control effectiveness, residual risk, and duty of care.",theme:"Mental-health privacy; advertising technology; consent; secondary use",class_reading_connection:"No — outside real-world example",real_world_example:"Cerebral online mental-health data used for advertising",what_actually_happened:"The FTC alleged Cerebral disclosed sensitive consumer information for advertising and failed to honor privacy and cancellation commitments.",real_world_source:"https://www.ftc.gov/legal-library/browse/cases-proceedings/222-3067-cerebral-inc-kyle-robertson-us-v",real_world_image:null,decisions:[{branch_id:"B525",decision:"Use standard ad-tech integrations",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Cambridge Analytica / Facebook data harvesting, The FTC alleged Facebook data from tens of millions of users was deceptively harvested and used by Cambridge Analytica for voter profiling and targeting. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"Cambridge Analytica / Facebook data harvesting",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2019/07/ftc-sues-cambridge-analytica-settles-former-ceo-app-developer",risk_tag:"Health Privacy Risk"},{branch_id:"B526",decision:"remove obvious clinical fields",consequence:"Removing obvious clinical fields before sending data to ad platforms preserves much of the marketing and growth value of the integration while stripping out the most direct signals of mental-health treatment. The tradeoff is that indirect signals can remain, so removing the obvious fields reduces but does not eliminate the risk that someone's treatment status is inferred.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Data Minimization"},{branch_id:"B527",decision:"require explicit opt-in",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In 2017 VIZIO smart-TV viewing-data settlement, The FTC alleged VIZIO collected second-by-second viewing information from millions of smart TVs without adequate knowledge or consent and shared data for advertising-related purposes. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"2017 VIZIO smart-TV viewing-data settlement",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2017/02/vizio-pay-22-million-ftc-state-new-jersey-settle-charges-it-collected-viewing-histories-11-million",risk_tag:"Informed Consent Risk"},{branch_id:"B528",decision:"prohibit advertising use of treatment-related data",consequence:"You gain the control or operational benefit of this option, but you must document and communicate the privacy/security risk that remains. The central tradeoff is: Growth and measurement vs. highly sensitive health privacy and trust.",consequence_type:"TRADEOFF",consequence_basis_example:"Cerebral online mental-health data used for advertising",consequence_source:"https://www.ftc.gov/legal-library/browse/cases-proceedings/222-3067-cerebral-inc-kyle-robertson-us-v",risk_tag:"Business Growth Risk"}],id:"S525"},{role:"App Executive",role_category:"Executive",situation:"You are the App Executive. You are responsible for the organization's business decision, reputation, resources, and accountability. Your fertility app relies on third-party analytics and advertising SDKs. They help improve the product and acquire users, but may receive reproductive-health and device information.",core_tradeoff:"App growth and analytics vs. reproductive-health privacy and third-party tracking. From this role, weigh organizational cost, reputation, business continuity, and accountability.",theme:"Fertility data; mobile tracking; health privacy; SDK governance",class_reading_connection:"No — outside real-world example",real_world_example:"Premom fertility app health-data sharing",what_actually_happened:"The FTC alleged Easy Healthcare's Premom app shared sensitive health data with third parties contrary to privacy promises.",real_world_source:"https://www.ftc.gov/legal-library/browse/cases-proceedings/202-3186-easy-healthcare-corporation-us-v",real_world_image:null, https://docs.fcc.gov/public/attachments/DOC-402213A1.pdf",risk_tag:"Informed Consent Risk"},{branch_id:"B532",decision:"remove advertising SDKs entirely",consequence:"Removing advertising SDKs entirely preserves the strongest protection against reproductive-health data reaching third parties with no clinical relationship to the user. The tradeoff is that the app loses the analytics and ad revenue those SDKs provided, which can mean less funding for the product itself.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Business Growth Risk"}],id:"S529"},{role:"User",role_category:"Individual",situation:"You are the User. You are directly affected by the organization's or government's decision and must decide what level of privacy, safety, convenience, or control you are willing to accept. Your fertility app relies on third-party analytics and advertising SDKs. They help improve the product and acquire users, but may receive reproductive-health and device information.",core_tradeoff:"App growth and analytics vs. reproductive-health privacy and third-party tracking. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person.",theme:"Fertility data; mobile tracking; health privacy; SDK governance",class_reading_connection:"No — outside real-world example",real_world_example:"Premom fertility app health-data sharing",what_actually_happened:"The FTC alleged Easy Healthcare's Premom app shared sensitive health data with third parties contrary to privacy promises.",real_world_source:"https://www.ftc.gov/legal-library/browse/cases-proceedings/202-3186-easy-healthcare-corporation-us-v",real_world_image:null,decisions:[{branch_id:"B533",decision:"Use the app under its existing third-party integration terms",consequence:"This choice gives you some combination of access, convenience, safety, privacy, or control, while leaving you to accept the corresponding personal tradeoff. The central tra ceive fertility or health data",consequence:"This choice gives you some combination of access, convenience, safety, privacy, or control, while leaving you to accept the corresponding personal tradeoff. The central tradeoff is: App growth and analytics vs. reproductive-health privacy and third-party tracking. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person..",consequence_type:"TRADEOFF",consequence_basis_example:"Premom fertility app health-data sharing",consequence_source:"https://www.ftc.gov/legal-library/browse/cases-proceedings/202-3186-easy-healthcare-corporation-us-v",risk_tag:"Business Growth Risk"}],id:"S533"},{role:"Privacy Engineer",role_category:"Security & Privacy Leader",situation:"You are the Privacy Engineer. You are responsible for identifying the privacy and security risk, recommending controls, and explaining the residual risk to leadership. Your fertility app relies on third-party analytics and advertising SDKs. They help improve the product and acquire users, but may receive reproductive-health and device information.",core_tradeoff:"App growth and analytics vs. reproductive-health privacy and third-party tracking. From this role, weigh privacy/security risk, control effectiveness, residual risk, and duty of care.",theme:"Fertility data; mobile tracking; health privacy; SDK governance",class_reading_connection:"No — outside real-world example",real_world_example:"Premom fertility app health-data sharing",what_actually_happened:"The FTC alleged Easy Healthcare's Premom app shared sensitive health data with third parties contrary to privacy promises.",real_world_source:"https://www.ftc.gov/legal-library/browse/cases-proceedings/202-3186-easy-healthcare-corporation-us-v",real_world_image:null,decisions:[{branch_id:"B537",decision:"Keep integrations under contracts",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In 2017 VIZIO smart-TV viewing-data settlement, The FTC alleged VIZIO collected second-by-second viewing information from millions of smart TVs without adequate knowledge or consent and shared data for advertising-related purposes. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"2017 VIZIO smart-TV viewing-data settlement",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2017/02/vizio-pay-22-million-ftc-state-new-jersey-settle-charges-it-collected-viewing-histories-11-million",risk_tag:"Third-Party Tracking Risk"},{branch_id:"B538",decision:"strip sensitive fields",consequence:"This option may reduce one part of the risk, but you still have to account for the privacy/security exposure that remains. The central tradeoff is App growth and analytics vs. reproductive-health privacy and third-party tracking. From this role, weigh privacy/security risk, control effectiveness, residual risk, and duty of care.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Data Minimization"},{branch_id:"B539",decision:"require explicit opt-in",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In 2024 FCC wireless-carrier location-data fines, The FCC fined major U.S. wireless carriers nearly $200 million for illegally sharing access to customers' location information without proper consent and safeguards. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"2024 FCC wireless-carrier location-data fines",consequence_source:"https://docs.fcc.gov/public/attachments/DOC-402213A1.pdf",risk_tag:"Informed Consent Risk"},{branch_id:"B540",decision:"remove advertising SDKs entirely",consequence:"Removing advertising SDKs entirely preserves the strongest protection against reproductive-health data reaching third parties with no clinical relationship to the user. The tradeoff is that the app loses the analytics and ad revenue those SDKs provided, which can mean less funding for the product itself.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Business Growth Risk"}],id:"S537"},{role:"Police Official",role_category:"Government & Regulator",situation:"You are the Police Official. You are responsible for deciding what oversight, legal authority, or public protections are appropriate. You can build a highly effective facial-recognition search engine by collecting publicly accessible images across the web without asking the people pictured. Law enforcement and security customers see major investigative value.",core_tradeoff:"Investigative capability and AI performance vs. biometric privacy, consent, and mass identification. From this role, weigh public interest, rights, safety, proportionality, and oversight.",theme:"Facial recognition; web scraping; biometrics; law enforcement",class_reading_connection:"No — outside real-world example",real_world_example:"Clearview AI facial-recognition scraping",what_actually_happened:"Clearview AI became a major policy controversy after building a facial-recognition database from billions of images gathered from public websites and social platforms.",real_world_source:"https://www.gao.gov/products/gao-21-518",real_world_image:"https://www.gao.gov/assets/extracts/a3f886f4dcdb6643725e6eb22582026b/rId14_image2.png",decisions:[{branch_id:"B541",decision:"Scrape public images broadly",consequence:"You gain the public-policy or enforcement benefit of this option, but you also accept its effect on rights, proportionality, oversight, and public trust. The central tradeoff is: Investigative capability and AI performance vs. biometric privacy, consent, and mass identification.",consequence_type:"TRADEOFF",consequence_basis_example:"Clearview AI facial-recognition scraping",consequence_source:"https://www.gao.gov/products/gao-21-518",risk_tag:"Biometric Privacy Risk"},{branch_id:"B542",decision:"limit collection to licensed sources",consequence:"Limiting collection to licensed sources preserves some investigative capability while avoiding the mass scraping of images from people who never agreed to be included in a facial-recognition database. The tradeoff is a smaller, less comprehensive database, which can mean lower accuracy or more missed matches in an investigation.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Legal Risk"},{branch_id:"B543",decision:"require opt-in/consent",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Everalbum facial-recognition model training, The FTC alleged Everalbum misled users about facial recognition and photo retention. The settlement required express consent and deletion of models and algorithms developed using improperly retained data. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"Everalbum facial-recognition model training",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2021/05/ftc-finalizes-settlement-photo-app-developer-related-misuse-facial-recognition-technology",risk_tag:"Consent Risk"},{branch_id:"B544",decision:"restrict use to narrowly defined investigations",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In DOJ use of StingRay / cell-site simulator technology, DOJ adopted a 2015 policy generally requiring a probable-cause search warrant for cell-site simulator use and established data-deletion, supervision, auditing, and privacy requirements. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"DOJ use of StingRay / cell-site simulator technology",consequence_source:"https://www.justice.gov/archives/opa/pr/justice-department-announces-enhanced-policy-use-cell-site-simulators",risk_tag:"Investigative Capability Risk"}],id:"S541"},{role:"Citizen",role_category:"Individual",situation:"You are the Citizen. You are directly affected by the organization's or government's decision and must decide what level of privacy, safety, convenience, or control you are willing to accept. You can build a highly effective facial-recognition search engine by collecting publicly accessible images across the web without asking the people pictured. Law enforcement and security customers see major investigative value.",core_tradeoff:"Investigative capability and AI performance vs. biometric privacy, consent, and mass identification. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person.",theme:"Facial recognition; web scraping; biometrics; law enforcement",class_reading_connection:"No — outside real-world example",real_world_example:"Clearview AI facial-recognition scraping",what_actually_happened:"Clearview AI became a major policy controversy after building a facial-recognition database from billions of images gathered from public websites and social platforms.",real_world_source:"https://www.gao.gov/products/gao-21-518",real_world_image:"https://www.gao.gov/assets/extracts/a3f886f4dcdb6643725e6eb22582026b/rId14_image2.png",decisions:[{branch_id:"B545",decision:"Accept law-enforcement use of scraped public images for investigations",consequence:"This choice gives you some combination of access, convenience, safety, privacy, or control, while leaving you to accept the corresponding personal tradeoff. The central tradeoff is: Investigative capability and AI performance vs. biometric privacy, consent, and mass identification. From t _basis_example:null,consequence_source:null,risk_tag:"Misuse Risk"},{branch_id:"B563",decision:"rely mainly on warnings and driver responsibility",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Tesla Autopilot safeguards and driver monitoring recall, NHTSA's 2023 Tesla recall addressed controls intended to prevent misuse of Autosteer, requiring additional safeguards and alerts. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"Tesla Autopilot safeguards and driver monitoring recall",consequence_source:"https://www.nhtsa.gov/press-releases/consumer-alert-tesla-recall-autopilot",risk_tag:"Public Safety Risk"},{branch_id:"B564",decision:"restrict the feature until stronger controls exist",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Tesla Autopilot safeguards and driver monitoring recall, NHTSA's 2023 Tesla recall addressed controls intended to prevent misuse of Autosteer, requiring additional safeguards and alerts. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"Tesla Autopilot safeguards and driver monitoring recall",consequence_source:"https://www.nhtsa.gov/press-releases/consumer-alert-tesla-recall-autopilot",risk_tag:"Product Capability Risk"}],id:"S561"},{role:"Consumer",role_category:"Individual",situation:"You are the Consumer. You are directly affected by the organization's or government's decision and must decide what level of privacy, safety, convenience, or control you are willing to accept. Your analytics company can buy and sell mobile advertising identifiers tied to precise location histories. The data has commercial uses but can potentially reveal where identifiable people live and which sensitive places they visit.",core_tradeoff:"Commercial analytics vs. persistent location surveillance and re-identification. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person.",theme:"Location data; data brokerage; re-identification; sensitive locations",class_reading_connection:"No — outside real-world example",real_world_example:"Kochava mobile-location data brokerage",what_actually_happened:"The FTC sued Kochava alleging its sale of precise geolocation data could expose consumers' visits to sensitive locations and enable identification and tracking.",real_world_source:"https://www.ftc.gov/news-events/news/press-releases/2022/08/ftc-sues-kochava-selling-data-tracks-people-reproductive-health-clinics-places-worship-other",real_world_image:null,decisions:[{branch_id:"B565",decision:"Allow apps to share precise location for services you value",consequence:"This choice gives you some combination of access, convenience, safety, privacy, or control, while leaving you to accept the corresponding personal tradeoff. The central tradeoff is: Commercial analytics vs. persistent location surveillance and re-identification. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person..",consequence_type:"TRADEOFF",consequence_basis_example:"Kochava mobile-location data brokerage",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2022/08/ftc-sues-kochava-selling-data-tracks-people-reproductive-health-clinics-places-worship-other",risk_tag:"Location Surveillance Risk"},{branch_id:"B566",decision:"disable precise location for apps that do not need it",consequence:"This choice gives you some combination of access, convenience, safety, privacy, or control, while leaving you to accept the corresponding personal tradeoff. The central tradeoff is: Commercial analytics vs. persistent location surveillance and re-identification. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person..",consequence_type:"TRADEOFF",consequence_basis_example:"Kochava mobile-location data brokerage",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2022/08/ftc-sues-kochava-selling-data-tracks-people-reproductive-health-clinics-places-worship-other",risk_tag:"Re-Identification Risk"},{branch_id:"B567",decision:"prefer services that provide only aggregated location products",consequence:"This choice gives you some combination of access, convenience, safety, privacy, or control, while leaving you to accept the corresponding personal tradeoff. The central tradeoff is: Commercial analytics vs. persistent location surveillance and re-identification. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person..",consequence_type:"TRADEOFF",consequence_basis_example:"Kochava mobile-location data brokerage",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2022/08/ftc-sues-kochava-selling-data-tracks-people-reproductive-health-clinics-places-worship-other",risk_tag:"Commercial Value Risk"},{branch_id:"B568",decision:"use location-sharing services only where consent and downstream-use restrictions are verifiable",consequence:"This choice gives you some combination of access, convenience, safety, privacy, or control, while leaving you to accept the corresponding personal tradeoff. The central tradeoff is: Commercial analytics vs. persistent location surveillance and re-identification. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person..",consequence_type:"TRADEOFF",consequence_basis_example:"Kochava mobile-location data brokerage",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2022/08/ftc-sues-kochava-selling-data-tracks-people-reproductive-health-clinics-places-worship-other",risk_tag:"Consent Risk"}],id:"S565"},{role:"Privacy Officer",role_category:"Security & Privacy Leader",situation:"You are the Privacy Officer. You are responsible for identifying the privacy and security risk, recommending controls, and explaining the residual risk to leadership. Your analytics company can buy and sell mobile advertising identifiers tied to precise location histories. The data has commercial uses but can potentially reveal where identifiable people live and which sensitive places they visit.",core_tradeoff:"Commercial analytics vs. persistent location surveillance and re-identification. From this role, weigh privacy/security risk, control effectiveness, residual risk, and duty of care.",theme:"Location data; data brokerage; re-identification; sensitive locations",class_reading_connection:"No — outside real-world example",real_world_example:"Kochava mobile-location data brokerage",what_actually_happened:"The FTC sued Kochava alleging its sale of precise geolocation data could expose consumers' visits to sensitive locations and enable identification and tracking.",real_world_source:"https://www.ftc.gov/news-events/news/press-releases/2022/08/ftc-sues-kochava-selling-data-tracks-people-reproductive-health-clinics-places-worship-other",real_world_image:null,decisions:[{branch_id:"B569",decision:"Sell raw location feeds",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Gravy Analytics / Venntel sensitive location-data case, The FTC alleged Gravy Analytics and Venntel unlawfully sold sensitive location data and imposed restrictions on selling or using data associated with sensitive locations. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"Gravy Analytics / Venntel sensitive location-data case",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2025/01/ftc-finalizes-order-prohibiting-gravy-analytics-venntel-selling-sensitive-location-data",risk_tag:"Location Surveillance Risk"},{branch_id:"B570",decision:"remove sensitive locations",consequence:"Removing sensitive locations before the data is sold preserves most of the commercial value of the mobility data while cutting out the visits, clinics, places of worship, and shelters most likely to expose something private. The tradeoff is that the filtering is never perfect, and enough other location points can still let a buyer infer where someone lives, works, or worships.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:null,risk_tag:"Re-Identification Risk"},{branch_id:"B571",decision:"provide aggregated products only",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Gravy Analytics / Venntel sensitive location-data case, The FTC alleged Gravy Analytics and Venntel unlawfully sold sensitive location data and imposed restrictions on selling or using data associated with sensitive locations. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"Gravy Analytics / Venntel sensitive location-data case",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2025/01/ftc-finalizes-order-prohibiting-gravy-analytics-venntel-selling-sensitive-location-data",risk_tag:"Commercial Value Risk"},{branch_id:"B572",decision:"require verified consent and use restrictions",consequence:"This option may reduce one part of the risk, but you still have to account for the privacy/security exposure that remains. The central tradeoff is Commercial analytics vs. persistent location surveillance and re-identification. From this role, weigh privacy/security risk, control effectiveness, residual risk, and duty of care.",consequence_type:"TRADEOFF",consequence_basis_example:null,consequence_source:n
