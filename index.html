,{role:"Regulator",role_category:"Government & Regulator",situation:"You are the Regulator. You are responsible for deciding what oversight, legal authority, or public protections are appropriate. Removing remote access reduces cyber risk but makes maintenance and emergency support slower and more expensive.",core_tradeoff:"Operational convenience/cost vs. public safety and critical-infrastructure security. From this role, weigh public interest, rights, safety, proportionality, and oversight.",theme:"Critical infrastructure; remote access; public safety; legacy systems",class_reading_connection:null,real_world_example:"2021 Oldsmar, Florida water-treatment intrusion",what_actually_happened:"An intruder remotely accessed the Oldsmar water-treatment system and attempted to alter sodium hydroxide settings; an operator noticed and reversed the change.",real_world_source:"https://www.propublica.org/article/hacking-water-systems",real_world_image:"https://www.propublica.org/wp-content/uploads/2021/03/20210317-water-hacking-3x2.jpg",decisions:[{branch_id:"B049",decision:"Eliminate remote access",consequence:"You gain the public-policy or enforcement benefit of this option, but you also accept its effect on rights, proportionality, oversight, and public trust. The central tradeoff is: Operational convenience/cost vs. public safety and critical-infrastructure security.",consequence_type:"TRADEOFF",consequence_basis_example:"2021 Oldsmar, Florida water-treatment intrusion",consequence_source:"https://www.propublica.org/article/hacking-water-systems",risk_tag:"Critical Infrastructure Security"},{branch_id:"B050",decision:"retain it with stronger controls",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Gravy Analytics / Venntel sensitive location-data case, The FTC alleged Gravy Analytics and Venntel unlawfully sold sensitive location data and imposed restrictions on selling or using data associated with sensitive locations. T PARABLE_REAL_WORLD",consequence_basis_example:"Blackbaud ransomware breach and data retention",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2024/05/ftc-finalizes-order-blackbaud-related-allegations-firms-security-failures-led-data-breach",risk_tag:"Private Profit"},{branch_id:"B239",decision:"permit third-party updates after support ends",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Blackbaud ransomware breach and data retention, The FTC alleged Blackbaud retained data longer than necessary and failed to use appropriate safeguards; attackers accessed sensitive data belonging to millions of consumers. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"Blackbaud ransomware breach and data retention",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2024/05/ftc-finalizes-order-blackbaud-related-allegations-firms-security-failures-led-data-breach",risk_tag:"Internet Security Risk"},{branch_id:"B240",decision:"disable network functions when support ends",consequence:"You gain the control or operational benefit of this option, but you must document and communicate the privacy/security risk that remains. The central tradeoff is: Low consumer price and private profit vs. lifecycle security and risks imposed on the wider Internet.",consequence_type:"TRADEOFF",consequence_basis_example:"Unsupported and non-updatable IoT devices",consequence_source:"https://www.nist.gov/publications/guidelines-smart-grid-cybersecurity",risk_tag:"Residual Security Risk"}],id:"S237"},{role:"AI Product Owner",role_category:"Product & Technology Leader",situation:"You are the AI Product Owner. You are responsible for how the technology is designed, implemented, supported, and changed. Your organization uses an algorithm to rank or classify people in a consequential process. People affected by the output want to know what data, assumptions, weights, and error rates drive the decision, but engineers warn that detailed disclosure could allow the system to be manipulated.",core_tradeoff:"Transparency, contestability, and accountability vs. security, proprietary information, and gaming resistance. From this role, weigh technical feasibility, design choices, usability, scale, and unintended consequences.",theme:"Algorithmic accountability; transparency; explainability; gaming",class_reading_connection:"Yes — Diakopoulos, Accountability in Algorithmic Decision Making",real_world_example:"Algorithmic transparency vs. gaming and manipulation",what_actually_happened:"The assigned Diakopoulos reading argues for algorithmic accountability and transparency while explicitly recognizing that disclosure can enable gaming, manipulation, and circumvention, requiring threat modeling and careful choices about what to reveal.",real_world_source:"https://www.ftc.gov/business-guidance/blog/2020/04/using-artificial-intelligence-and-algorithms",real_world_image:null,decisions:[{branch_id:"B241",decision:"Publish detailed model information",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Facebook emotional contagion experiment (2012/2014), Facebook altered News Feed exposure for 689,003 users to test emotional contagion. The published study triggered controversy over informed consent, opt-out rights, and the different ethical standards applied to corporate and academic research. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"Facebook emotional contagion experiment (2012/2014)",consequence_source:"https://www.pnas.org/doi/10.1073/pnas.1320040111",risk_tag:"Transparency"},{branch_id:"B242",decision:"disclose only high-level factors and error rates",c /business-guidance/blog/2020/04/using-artificial-intelligence-and-algorithms",risk_tag:"Proprietary Information"}],id:"S241"},{role:"CIO",role_category:"Security & Privacy Leader",situation:"You are the CIO. You are responsible for identifying the privacy and security risk, recommending controls, and explaining the residual risk to leadership. Your organization uses an algorithm to rank or classify people in a consequential process. People affected by the output want to know what data, assumptions, weights, and error rates drive the decision, but engineers warn that detailed disclosure could allow the system to be manipulated.",core_tradeoff:"Transparency, contestability, and accountability vs. security, proprietary information, and gaming resistance. From this role, weigh privacy/security risk, control effectiveness, residual risk, and duty of care.",theme:"Algorithmic accountability; transparency; explainability; gaming",class_reading_connection:"Yes — Diakopoulos, Accountability in Algorithmic Decision Making",real_world_example:"Algorithmic transparency vs. gaming and manipulation",what_actually_happened:"The assigned Diakopoulos reading argues for algorithmic accountability and transparency while explicitly recognizing that disclosure can enable gaming, manipulation, and circumvention, requiring threat modeling and careful choices about what to reveal.",real_world_source:"https://www.ftc.gov/business-guidance/blog/2020/04/using-artificial-intelligence-and-algorithms",real_world_image:null,decisions:[{branch_id:"B245",decision:"Publish detailed model information",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Facebook emotional contagion experiment (2012/2014), Facebook altered News Feed exposure for 689,003 users to test emotional contagion. The published study triggered controversy over informed consent, opt-out rights, and the different ethical standards applied to corporate and academic research. This does tional benefit of this option, but you must document and communicate the privacy/security risk that remains. The central tradeoff is: Transparency, contestability, and accountability vs. security, proprietary information, and gaming resistance.",consequence_type:"TRADEOFF",consequence_basis_example:"Algorithmic transparency vs. gaming and manipulation",consequence_source:"https://www.ftc.gov/business-guidance/blog/2020/04/using-artificial-intelligence-and-algorithms",risk_tag:"Proprietary Information"}],id:"S245"},{role:"AI Product Owner",role_category:"Individual",situation:"You are the AI Product Owner. You are directly affected by the organization's or government's decision and must decide what level of privacy, safety, convenience, or control you are willing to accept. Your organization uses an algorithm to rank or classify people in a consequential process. People affected by the output want to know what data, assumptions, weights, and error rates drive the decision, but engineers warn that detailed disclosure could allow the system to be manipulated.",core_tradeoff:"Transparency, contestability, and accountability vs. security, proprietary information, and gaming resistance. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person.",theme:"Algorithmic accountability; transparency; explainability; gaming",class_reading_connection:"Yes — Diakopoulos, Accountability in Algorithmic Decision Making",real_world_example:"Algorithmic transparency vs. gaming and manipulation",what_actually_happened:"The assigned Diakopoulos reading argues for algorithmic accountability and transparency while explicitly recognizing that disclosure can enable gaming, manipulation, and circumvention, requiring threat modeling and careful choices about what to reveal.",real_world_source:"https://www.ftc.gov/business-guidance/blog/2020/04/using-artificial-intelligence-and-algorithms",real_world_image:null,decisions:[{branch_id:"B249",decision: ed example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"2020 FTC Zoom security settlement",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2020/11/ftc-requires-zoom-enhance-its-security-practices-part-settlement",risk_tag:"Accountability"},{branch_id:"B252",decision:"keep the model confidential and rely on internal audits",consequence:"You gain the personal convenience, safety, access, or control offered by this option, while personally carrying the privacy, autonomy, or other downside that remains. The central tradeoff is: Transparency, contestability, and accountability vs. security, proprietary information, and gaming resistance.",consequence_type:"TRADEOFF",consequence_basis_example:"Algorithmic transparency vs. gaming and manipulation",consequence_source:"https://www.ftc.gov/business-guidance/blog/2020/04/using-artificial-intelligence-and-algorithms",risk_tag:"Proprietary Information"}],id:"S249"},{role:"Government CIO",role_category:"Government & Regulator",situation:"You are the Government CIO. You are responsible for deciding what oversight, legal authority, or public protections are appropriate. Your organization can deploy strong anonymity technology that protects vulnerable users from identification. The same technology can also conceal misconduct and make legitimate oversight more difficult.",core_tradeoff:"Privacy and protection from retaliation vs. transparency, accountability, and unwanted secrecy. From this role, weigh public interest, rights, safety, proportionality, and oversight.",theme:"Privacy-enhancing technology; anonymity; accountability; dual use",class_reading_connection:"Yes — Privacy-Enhancing Technologies reading",real_world_example:"Privacy-enhancing technologies used to protect secrecy",what_actually_happened:"The assigned PET reading emphasizes that privacy-enhancing technologies are dual-use: protecting identity can advance privacy and freedom, but the same tools can reinforce organizational secrecy or existing power structures.",real_world_source:"https://signal.org/blog/doodles-stickers-censorship/",real_world_image:"https://signal.org/blog/images/censorship.jpg",decisions:[{branch_id:"B253",decision:"Provide strong anonymity to everyone",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Cambridge Analytica / Facebook data harvesting, The FTC alleged Facebook data from tens of millions of users was deceptively harvested and used by Cambridge Analytica for voter profiling and targeting. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"Cambridge Analytica / Facebook data harvesting",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2019/07/ftc-sues-cambridge-analytica-settles-former-ceo-app-developer",risk_tag:"Privacy Protection"},{branch_id:"B254",decision:"require identity escrow that can be opened under judicial process",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Cambridge Analytica / Facebook data harvesting, The FTC alleged Facebook data from tens of millions of users was deceptively harvested and used by Cambridge Analytica for voter profiling and targeting. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"Cambridge Analytica / Facebook data harvesting",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2019/07/ftc-sues-cambridge-analytica-settles-former-ceo-app-developer",risk_tag:"Judicial Oversight"},{branch_id:"B255",decision:"restrict anonymity to approved uses",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In DOJ use of StingRay / cell-site simulator technology, DOJ adopted a 2015 policy generally requiring a probable-cause search warrant for cell-site simulator use and established data-deletion, supervision, auditing, and privacy requirements. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"DOJ use of StingRay / cell-site simulator technology",consequence_source:"https://www.justice.gov/archives/opa/pr/justice-department-announces-enhanced-policy-use-cell-site-simulators",risk_tag:"Accountability"},{branch_id:"B256",decision:"prioritize transparency and do not deploy",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Carnegie Mellon Tor deanonymization research / cancelled Black Hat 2014 talk, A planned 2014 Black Hat talk by Carnegie Mellon researchers titled 'You Don't Have to be the NSA to Break Tor: Deanonymizing Users on a Budget' was cancelled after university legal counsel said the materials were not approved for public release. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"Carnegie Mellon Tor deanonymization research / cancelled Black Hat 2014 talk",consequence_source:"https://www.blackhat.com/latestintel/07212014-a-schedule-update.html",risk_tag:"Transparency"}],id:"S253"},{role:"Government CIO",role_category:"Security & Privacy Leader",situation:"You are the Government CIO. You are responsible for identifying the privacy and security risk, recommending controls, and explaining the residual risk to leadership. Your organization can deploy strong anonymity technology that protects vulnerable users from identification. The same technology can also conceal misconduct and make legitimate oversight more difficult.",core_tradeoff:"Privacy and protec ides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"AOL release of pseudonymized search logs",consequence_source:"https://www.wired.com/2006/08/faq-aols-search-gaffe-and-you/",risk_tag:"Business Growth Risk"}],id:"S537"},{role:"Police Official",role_category:"Government & Regulator",situation:"You are the Police Official. You are responsible for deciding what oversight, legal authority, or public protections are appropriate. You can build a highly effective facial-recognition search engine by collecting publicly accessible images across the web without asking the people pictured. Law enforcement and security customers see major investigative value.",core_tradeoff:"Investigative capability and AI performance vs. biometric privacy, consent, and mass identification. From this role, weigh public interest, rights, safety, proportionality, and oversight.",theme:"Facial recognition; web scraping; biometrics; law enforcement",class_reading_connection:"No — outside real-world example",real_world_example:"Clearview AI facial-recognition scraping",what_actually_happened:"Clearview AI became a major policy controversy after building a facial-recognition database from billions of images gathered from public websites and social platforms.",real_world_source:"https://www.gao.gov/products/gao-21-518",real_world_image:"https://www.gao.gov/assets/extracts/a3f886f4dcdb6643725e6eb22582026b/rId14_image2.png",decisions:[{branch_id:"B541",decision:"Scrape public images broadly",consequence:"You gain the public-policy or enforcement benefit of this option, but you also accept its effect on rights, proportionality, oversight, and public trust. The central tradeoff is: Investigative capability and AI performance vs. biometric privacy, consent, and mass identification.",consequence_type:"TRADEOFF",consequence_basis_example:"Clearview AI facial-recognition scraping",consequence_source:"https://www.gao.gov/products/gao-21-518",risk_tag:"Biometric Privacy Risk"},{branch_id:"B542",decision:"limit collection to licensed sources",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In NSA Section 215 bulk telephone metadata program, The Privacy and Civil Liberties Oversight Board reviewed the Section 215 bulk telephone-records program and recommended ending it, citing legal, constitutional, privacy, and civil-liberties concerns and limited demonstrated value. The USA FREEDOM Act later ended the prior bulk-collection model. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"NSA Section 215 bulk telephone metadata program",consequence_source:"https://www.pclob.gov/Oversight",risk_tag:"Legal Risk"},{branch_id:"B543",decision:"require opt-in/consent",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Everalbum facial-recognition model training, The FTC alleged Everalbum misled users about facial recognition and photo retention. The settlement required express consent and deletion of models and algorithms developed using improperly retained data. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"Everalbum facial-recognition model training",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2021/05/ftc-finalizes-settlement-photo-app-developer-related-misuse-facial-recognition-technology",risk_tag:"Consent Risk"},{branch_id:"B544",decision:"restrict use to narrowly defined investigations",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In DOJ use of StingRay / cell-site simulator technology, DOJ adopted a 2015 policy generally requiring a probable-cause search warrant for cell-site simulator use and established data-deletion, supervision, auditing, and privacy requirements. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"DOJ use of StingRay / cell-site simulator technology",consequence_source:"https://www.justice.gov/archives/opa/pr/justice-department-announces-enhanced-policy-use-cell-site-simulators",risk_tag:"Investigative Capability Risk"}],id:"S541"},{role:"Citizen",role_category:"Individual",situation:"You are the Citizen. You are directly affected by the organization's or government's decision and must decide what level of privacy, safety, convenience, or control you are willing to accept. You can build a highly effective facial-recognition search engine by collecting publicly accessible images across the web without asking the people pictured. Law enforcement and security customers see major investigative value.",core_tradeoff:"Investigative capability and AI performance vs. biometric privacy, consent, and mass identification. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person.",theme:"Facial recognition; web scraping; biometrics; law enforcement",class_reading_connection:"No — outside real-world example",real_world_example:"Clearview AI facial-recognition scraping",what_actually_happened:"Clearview AI became a major policy controversy after building a facial-recognition database from billions of images gathered from public websites and social platforms.",real_world_source:"https://www.gao.gov/products/gao-21-518",real_world_image:"https://www.gao.gov/assets/extracts/a3f886f4dcdb6643725e6eb22582026b/rId14_image2.png",decisions:[{branch_id:"B545",decision:"Scrape public images broadly",consequence:"You gain the personal convenience, safety, access, or control offered by this option, while personally carrying th -technology",risk_tag:"Consent Risk"},{branch_id:"B548",decision:"restrict use to narrowly defined investigations",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In DOJ use of StingRay / cell-site simulator technology, DOJ adopted a 2015 policy generally requiring a probable-cause search warrant for cell-site simulator use and established data-deletion, supervision, auditing, and privacy requirements. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"DOJ use of StingRay / cell-site simulator technology",consequence_source:"https://www.justice.gov/archives/opa/pr/justice-department-announces-enhanced-policy-use-cell-site-simulators",risk_tag:"Investigative Capability Risk"}],id:"S545"},{role:"Privacy Officer",role_category:"Security & Privacy Leader",situation:"You are the Privacy Officer. You are responsible for identifying the privacy and security risk, recommending controls, and explaining the residual risk to leadership. You can build a highly effective facial-recognition search engine by collecting publicly accessible images across the web without asking the people pictured. Law enforcement and security customers see major investigative value.",core_tradeoff:"Investigative capability and AI performance vs. biometric privacy, consent, and mass identification. From this role, weigh privacy/security risk, control effectiveness, residual risk, and duty of care.",theme:"Facial recognition; web scraping; biometrics; law enforcement",class_reading_connection:"No — outside real-world example",real_world_example:"Clearview AI facial-recognition scraping",what_actually_happened:"Clearview AI became a major policy controversy after building a facial-recognition database from billions of images gathered from public websites and social platforms.",real_world_source:"https://www.gao.gov/products/gao-21-518",real_world_image:"https://www.gao.gov/assets/extracts/a3f886f4dcdb6643725e6eb22582026b/rId14_image2.png",decisions:[{branch_id:"B549",decision:"Scrape public images broadly",consequence:"You gain the control or operational benefit of this option, but you must document and communicate the privacy/security risk that remains. The central tradeoff is: Investigative capability and AI performance vs. biometric privacy, consent, and mass identification.",consequence_type:"TRADEOFF",consequence_basis_example:"Clearview AI facial-recognition scraping",consequence_source:"https://www.gao.gov/products/gao-21-518",risk_tag:"Biometric Privacy Risk"},{branch_id:"B550",decision:"limit collection to licensed sources",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In NSA Section 215 bulk telephone metadata program, The Privacy and Civil Liberties Oversight Board reviewed the Section 215 bulk telephone-records program and recommended ending it, citing legal, constitutional, privacy, and civil-liberties concerns and limited demonstrated value. The USA FREEDOM Act later ended the prior bulk-collection model. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"NSA Section 215 bulk telephone metadata program",consequence_source:"https://www.pclob.gov/Oversight",risk_tag:"Legal Risk"},{branch_id:"B551",decision:"require opt-in/consent",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Everalbum facial-recognition model training, The FTC alleged Everalbum misled users about facial recognition and photo retention. The settlement required express consent and deletion of models and algorithms developed using improperly retained data. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"Everalbum facial-recognition model training",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2021/05/ftc-finalizes-settlement-photo-app-developer-related-misuse-facial-recognition-technology",risk_tag:"Consent Risk"},{branch_id:"B552",decision:"restrict use to narrowly defined investigations",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In DOJ use of StingRay / cell-site simulator technology, DOJ adopted a 2015 policy generally requiring a probable-cause search warrant for cell-site simulator use and established data-deletion, supervision, auditing, and privacy requirements. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"DOJ use of StingRay / cell-site simulator technology",consequence_source:"https://www.justice.gov/archives/opa/pr/justice-department-announces-enhanced-policy-use-cell-site-simulators",risk_tag:"Investigative Capability Risk"}],id:"S549"},{role:"Safety Engineer",role_category:"Product & Technology Leader",situation:"You are the Safety Engineer. You are responsible for how the technology is designed, implemented, supported, and changed. Stronger safeguards and monitoring may frustrate users and limit features, while weaker controls increase the risk that drivers misuse automation.",core_tradeoff:"Convenience and product capability vs. predictable misuse and public safety. From this role, weigh technical feasibility, design choices, usability, scale, and unintended consequences.",theme:"Automation; human factors; safety engineering; foreseeable misuse",class_reading_connection:"No — outside real-world example",real_world_example:"Tesla Autopilot safeguards and driver monitoring recall",what_actually_happened:"NHTSA's 2023 Tesla recall addressed controls intended to prevent misuse of Autosteer, requiring additional safeguards and alerts.",real_world_source:"https://www.nhtsa.gov/press-releases/consumer-alert-tesla-recall-autopilot",real_world_image:null,decisions:[{branch_id:"B553",decision:"Add aggressive driver monitoring and usage limits",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Netflix Prize dataset de-anonymization, Researchers Narayanan and Shmatikov demonstrated that records in the Netflix Prize dataset could be de-anonymized using limited outside knowledge and public IMDb ratings, illustrating the limits of simple anonymization for high-dimensional data. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"Netflix Prize dataset de-anonymization",consequence_source:"https://www.cs.cornell.edu/~shmat/netflix-faq.html",risk_tag:"Convenience Risk"},{branch_id:"B554",decision:"add moderate safeguards",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In 2017 Abbott / St. Jude pacemaker cybersecurity firmware update, Abbott released FDA-approved firmware updates intended to mitigate cybersecurity vulnerabilities in implantable cardiac pacemakers. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"2017 Abbott / St. Jude pacemaker cybersecurity firmware update",consequence_source:"https://www.fda.gov/medical-devices/digital-health-center-excellence/cybersecurity",risk_tag:"Misuse Risk"},{branch_id:"B555",decision:"rely mainly on warnings and driver responsibility",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In iTutorGroup automated age discrimination, The EEOC alleged iTutorGroup programmed application software to automatically reject female applicants 55 or older and male applicants 60 or older, affecting more than 200 qualified applicants. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"iTutorGroup automated age discrimination",consequence_source:"https://www.eeoc.gov/newsroom/itutorgroup-pay-365000-settle-eeoc-discriminatory-hiring-suit",risk_tag:"Public Safety Risk"},{branch_id:"B556",decision:"restrict the feature until stronger controls exist",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Netflix Prize dataset de-anonymization, Researchers Narayanan and Shmatikov demonstrated that records in the Netflix Prize dataset could be de-anonymized using limited outside knowledge and public IMDb ratings, illustrating the limits of simple anonymization for high-dimensional data. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"Netflix Prize dataset de-anonymization",consequence_source:"https://www.cs.cornell.edu/~shmat/netflix-faq.html",risk_tag:"Product Capability Risk"}],id:"S553"},{role:"Automaker Executive",role_category:"Executive",situation:"You are the Automaker Executive. You are responsible for the organization's business decision, reputation, resources, and accountability. Stronger safeguards and monitoring may frustrate users and limit features, while weaker controls increase the risk that drivers misuse automation.",core_tradeoff:"Convenience and product capability vs. predictable misuse and public safety. From this role, weigh organizational cost, reputation, business continuity, and accountability.",theme:"Automation; human factors; safety engineering; foreseeable misuse",class_reading_co  weigh public interest, rights, safety, proportionality, and oversight.",theme:"Automation; human factors; safety engineering; foreseeable misuse",class_reading_connection:"No — outside real-world example",real_world_example:"Tesla Autopilot safeguards and driver monitoring recall",what_actually_happened:"NHTSA's 2023 Tesla recall addressed controls intended to prevent misuse of Autosteer, requiring additional safeguards and alerts.",real_world_source:"https://www.nhtsa.gov/press-releases/consumer-alert-tesla-recall-autopilot",real_world_image:null,decisions:[{branch_id:"B561",decision:"Add aggressive driver monitoring and usage limits",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Netflix Prize dataset de-anonymization, Researchers Narayanan and Shmatikov demonstrated that records in the Netflix Prize dataset could be de-anonymized using limited outside knowledge and public IMDb ratings, illustrating the limits of simple anonymization for high-dimensional data. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"Netflix Prize dataset de-anonymization",consequence_source:"https://www.cs.cornell.edu/~shmat/netflix-faq.html",risk_tag:"Convenience Risk"},{branch_id:"B562",decision:"add moderate safeguards",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In 2017 Abbott / St. Jude pacemaker cybersecurity firmware update, Abbott released FDA-approved firmware updates intended to mitigate cybersecurity vulnerabilities in implantable cardiac pacemakers. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"2017 Abbott / St. Jude pacemaker cybersecurity firmware update",consequence_source:"https://w mobile advertising identifiers tied to precise location histories. The data has commercial uses but can potentially reveal where identifiable people live and which sensitive places they visit.",core_tradeoff:"Commercial analytics vs. persistent location surveillance and re-identification. From this role, weigh personal privacy, autonomy, safety, trust, and consequences to the affected person.",theme:"Location data; data brokerage; re-identification; sensitive locations",class_reading_connection:"No — outside real-world example",real_world_example:"Kochava mobile-location data brokerage",what_actually_happened:"The FTC sued Kochava alleging its sale of precise geolocation data could expose consumers' visits to sensitive locations and enable identification and tracking.",real_world_source:"https://www.ftc.gov/news-events/news/press-releases/2022/08/ftc-sues-kochava-selling-data-tracks-people-reproductive-health-clinics-places-worship-other",real_world_image:null,decisions:[{branch_id:"B565",decision:"Sell raw location feeds",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In Gravy Analytics / Venntel sensitive location-data case, The FTC alleged Gravy Analytics and Venntel unlawfully sold sensitive location data and imposed restrictions on selling or using data associated with sensitive locations. This does not mean the same result is guaranteed here, but it provides an evidence-based example of a similar decision path.",consequence_type:"COMPARABLE_REAL_WORLD",consequence_basis_example:"Gravy Analytics / Venntel sensitive location-data case",consequence_source:"https://www.ftc.gov/news-events/news/press-releases/2024/12/ftc-order-prohibits-data-brokers-gravy-analytics-venntel-selling-sensitive-location-data",risk_tag:"Location Surveillance Risk"},{branch_id:"B566",decision:"remove sensitive locations",consequence:"A comparable real-world case shows the kind of consequence this choice can create. In AOL release of pseudo
